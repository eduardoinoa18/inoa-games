<!doctype html>
<html lang="en"><head><meta charset="utf-8"><script src="../engine/guard.js"></script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hometown spike</title><meta name="robots" content="noindex">
<!-- Flagship feasibility spike (docs/DECISIONS/0003): a greybox town square built from existing pack models + a
     dungeon-room group that is created and disposed repeatedly. Deployed but unlinked (noindex) so it can be opened on a real phone: /labs/hometown.html?hud=1. It measures
     draw calls, triangles and GPU-resource counts so the go/no-go is based on numbers. Open on a phone with ?hud=1. -->
<link rel="stylesheet" href="../engine/ui.css">
<style>canvas{position:fixed;inset:0;width:100%;height:100%}#hud{position:fixed;left:8px;top:8px;z-index:5;background:rgba(0,0,0,.6);color:#fff;font:12px/1.4 monospace;padding:6px 8px;border-radius:8px;white-space:pre}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
</head><body><canvas id="gl"></canvas><div id="hud" hidden></div>
<script type="module">
import * as THREE from 'three';
import * as E from '../engine/inoa3d.js';
const R = E.createRenderer(document.getElementById('gl'), { fov: 55, portraitFov: 70, far: 400, shadowSize: 40 });
const { scene, camera, renderer } = R;
await E.loadPack('../packs/runner.json', R);
R.setLook({ clouds: true }); if (E.ASSETS.hdri.sunset) R.setEnv(E.ASSETS.hdri.sunset);

/* ---- town square (greybox from runner models: houses, vehicles, benches, palms) ---- */
const town = new THREE.Group(); scene.add(town);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), E.pbr ? E.pbr('stone', { color: 0xd9c7a8 }) : new THREE.MeshStandardMaterial({ color: 0xd9c7a8 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; town.add(ground);
const plaza = new THREE.Mesh(new THREE.CircleGeometry(9, 40), new THREE.MeshStandardMaterial({ color: 0xc9a884, roughness: .9 })); plaza.rotation.x = -Math.PI / 2; plaza.position.y = .02; town.add(plaza);
const fountain = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.8, .9, 28), new THREE.MeshStandardMaterial({ color: 0xb8b0a4 })); fountain.position.y = .45; fountain.castShadow = true; town.add(fountain);
const put = (name, x, z, ry = 0, s = 1) => { if (!E.ASSETS.models[name]) return null; const m = E.instance(name, { scale: s, outline: false }); m.position.set(x, 0, z); m.rotation.y = ry; town.add(m); return m; };
const HOUSES = ['house1', 'house-4', 'house-5', 'house-6', 'house-7'];
for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2, r = 24; put(HOUSES[i % HOUSES.length], Math.cos(a) * r, Math.sin(a) * r, -a + Math.PI / 2, 6); }
for (let i = 0; i < 8; i++) { const a = (i + .5) / 8 * Math.PI * 2; put('bench', Math.cos(a) * 11, Math.sin(a) * 11, -a, 1.6); put(i % 2 ? 'palm-long' : 'palm-detailed-short', Math.cos(a) * 15, Math.sin(a) * 15, a, 5); }
put('ice-cream-truck', 6, 18, 2.2, 3.4); put('van', -14, 8, .4, 3.2); put('delivery-truck', 12, -16, -1, 3.4); put('ferris-wheel', -30, -34, .6, 16);
// NPCs: the six hero rigs standing around the plaza (a shop keeper, quest givers…)
const npcs = []; ['skater-female', 'skater-male', 'survivor-female', 'survivor-male', 'cyborg-female', 'male'].forEach((m, i) => { const a = i / 6 * Math.PI * 2 + .3; const n = put(m, Math.cos(a) * 6.5, Math.sin(a) * 6.5, -a - Math.PI / 2, 1.9); if (n) npcs.push(n); });

/* ---- a dungeon room: built and disposed like a Depths room transition ---- */
let room = null;
function buildRoom(seed) {
  const g = new THREE.Group(); const mat = new THREE.MeshStandardMaterial({ color: 0x5a6070, roughness: .95 });
  const floor = new THREE.Mesh(new THREE.BoxGeometry(30, .4, 30), mat); floor.position.y = -.2; g.add(floor);
  for (let i = 0; i < 4; i++) { const w = new THREE.Mesh(new THREE.BoxGeometry(30, 6, 1), mat); w.position.set(0, 3, 0); w.rotation.y = i * Math.PI / 2; w.translateZ(15); g.add(w); }
  const tex = new THREE.CanvasTexture(Object.assign(document.createElement('canvas'), { width: 64, height: 64 })); g.add(new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshBasicMaterial({ map: tex })));
  for (let i = 0; i < 24; i++) { const n = ['barrel', 'chest', 'sci-fi-crate'][i % 3]; if (!E.ASSETS.models[n]) continue; const m = E.instance(n, { scale: 1.4, outline: false }); m.position.set(((i * 7 + seed) % 26) - 13, 0, ((i * 11 + seed) % 26) - 13); g.add(m); }
  g.position.set(0, -60, 0); scene.add(g); return g;
}
function disposeRoom(g) {
  scene.remove(g);
  // dispose only what the room created itself: instances share the pack's geometry/materials, which must stay alive
  g.traverse(o => { if (o.isMesh && !o.userData.fromPack) { if (o.geometry && !o.geometry.userData.shared) o.geometry.dispose(); const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(m => { if (m && !m.userData.shared) { if (m.map) m.map.dispose(); m.dispose(); } }); } });
}
// mark pack-owned resources so the room disposer leaves them alone
function markShared(root) { root.traverse(o => { if (o.isMesh) { if (o.geometry) o.geometry.userData.shared = true; (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m && (m.userData.shared = true)); } }); }
for (const k in E.ASSETS.models) { const v = E.ASSETS.models[k]; if (v && v.scene) markShared(v.scene); else if (v && v.isObject3D) markShared(v); }

// bake: every static town mesh (not the NPC rigs) merged per material — the draw-call fix proven in Tide Runner
let baked = null;
function bakeTown() { const statics = town.children.filter(c => !npcs.includes(c)); const tmp = new THREE.Group(); statics.forEach(c => tmp.add(c)); baked = E.bakeStatic(tmp); town.add(baked); }
camera.position.set(0, 16, 30); camera.lookAt(0, 1, 0);
function sceneOnlyStats() { renderer.info.autoReset = false; renderer.info.reset(); renderer.render(scene, camera); const r = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles }; renderer.info.autoReset = true; return r; }
const mem = () => ({ geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures, programs: renderer.info.programs ? renderer.info.programs.length : null });
window.__SPIKE = {
  split() { npcs.forEach(n => n.visible = false); const noNpc = sceneOnlyStats().calls; npcs.forEach(n => n.visible = true); const sh = renderer.shadowMap.enabled; renderer.shadowMap.enabled = false; const noShadow = sceneOnlyStats().calls; renderer.shadowMap.enabled = sh; let meshes = 0; npcs[0] && npcs[0].traverse(o => { if (o.isMesh) meshes++; }); return { all: sceneOnlyStats().calls, withoutNpcs: noNpc, withoutShadows: noShadow, meshesPerNpc: meshes }; },
  bake() { if (!baked) bakeTown(); return window.__SPIKE.town(); },
  town: () => Object.assign({ npcs: npcs.length, objects: town.children.length }, sceneOnlyStats(), mem()),
  cycle(n = 20) {
    const before = mem(), per = [];
    for (let i = 0; i < n; i++) { if (room) disposeRoom(room); room = buildRoom(i * 3); sceneOnlyStats(); per.push(mem().geometries); }
    if (room) { disposeRoom(room); room = null; } sceneOnlyStats();
    return { before, after: mem(), geometriesDuringCycles: per };
  },
  frameMs(n = 30) { const t0 = performance.now(); for (let i = 0; i < n; i++) R.render(1 / 60); return +((performance.now() - t0) / n).toFixed(1); }
};
const hud = document.getElementById('hud'); hud.hidden = false; // always on: this page exists to read numbers
let t = 0, acc = 0, n = 0;
E.loop(dt => { t += dt; camera.position.set(Math.sin(t * .1) * 30, 16, Math.cos(t * .1) * 30); camera.lookAt(0, 1, 0); R.render(dt); acc += dt; n++; if (acc > 1 && !hud.hidden) { const s = window.__SPIKE.town(); hud.textContent = `fps ${Math.round(n / acc)}  calls ${s.calls}  tris ${s.triangles}\ngeo ${s.geometries}  tex ${s.textures}  low ${R.low}`; acc = 0; n = 0; } });
window.__READY = true;
</script>
</body></html>
