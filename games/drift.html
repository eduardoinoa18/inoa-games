.dr-left{position:fixed;left:12px;top:64px;z-index:20;display:grid;gap:6px;pointer-events:none}
.dr-item{position:fixed;right:14px;top:64px;z-index:20;width:74px;height:74px;border-radius:22px;background:rgba(255,248,238,.92);display:grid;place-items:center;font-size:40px;box-shadow:0 6px 20px rgba(0,0,0,.2);transition:background .2s}
.dr-item.empty{background:rgba(255,248,238,.4);box-shadow:inset 0 0 0 3px rgba(255,255,255,.7)}
.dr-item.empty span{font-size:28px;opacity:.45;filter:grayscale(1)}
.dr-item.roll{animation:roll .12s steps(1) infinite}
@keyframes roll{50%{transform:scale(1.08)}}
#minimap{position:fixed;right:14px;bottom:110px;z-index:19;width:140px;height:140px;border-radius:20px;background:rgba(13,27,38,.45);backdrop-filter:blur(4px)}

.ig-title .ig-how{grid-template-columns:repeat(3,minmax(0,1fr))}

.dr-setup{display:grid;gap:6px;min-width:0}
.dr-lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#4c5868;margin-top:4px}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pick.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.pick button{min-height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;cursor:pointer;padding:6px 8px;font-size:14px;color:var(--ink);line-height:1.15;text-align:left}
.pick.three button{text-align:center}

.pick.dim button:not(.on){opacity:.55}
.pick .rec{color:var(--mint-ink);font-weight:800}
.dr-cup{width:100%;border-collapse:collapse;font-weight:700;font-size:15px}
.dr-cup td{padding:7px 6px;border-bottom:1px solid var(--line)}
.dr-cup tr.me td{background:var(--mint);font-weight:900}
.dr-cup td.n{text-align:right;font-family:var(--f-d)}
.dr-cup .plus{color:var(--mint-ink);font-size:12px}

  E.say(L(`You are ${ORD(myPos)} in the cup with ${table[myPos - 1].pts} points.`, `Vas en el puesto ${myPos} de la copa con ${table[myPos - 1].pts} puntos.`), { interrupt: false });
  d.querySelector('[data-a=next]').onclick = () => { d.remove(); if (last) cupResults(); else { cup.i++; startRace(); } };
  d.querySelector('[data-a=quit]').onclick = () => { d.remove(); cupResults(true); };
}
function cupTable() { const me = G.me; return G.karts.map(k => ({ ri: k.ri, name: k.isPlayer ? L('You', 'Tú') + ' · ' + k.def.name : k.def.name, e: k.isPlayer ? '⭐' : (STYLES[k.def.style] || STYLES.all).e, pts: cup.pts[k.ri] || 0, me: k === me, last: cup.last[k.ri] ?? 9 })).sort((a, b) => b.pts - a.pts || a.last - b.last); }
function cupResults(quit = false) {
  const table = cupTable(); const pos = table.findIndex(r => r.me) + 1, mine = table[pos - 1].pts; const races = cup.i + 1;
  const full = !quit && races >= CUP_ORDER.length; const k = races / CUP_ORDER.length; const wins = cup.wins;
  const xp = Math.round(([260, 210, 175, 150, 130, 110][pos - 1] || 100) * k), coins = Math.round(([80, 60, 45, 36, 30, 24][pos - 1] || 20) * k);
  if (full && (S.cupBest == null || pos < S.cupBest)) { S.cupBest = pos; saveS(); }
  if (full) { celebrate(pos); E.say(pos === 1 ? L('You won the Island Cup!', '¡Ganaste la Copa Isla!') : L(`You finished the cup ${ORD(pos)}!`, `¡Terminaste la copa en el puesto ${pos}!`), { interrupt: false }); }
  cup = null; S.mode = 'cup';
  E.results({ gameId: 'drift', title: full ? (pos === 1 ? L('Island Cup champion!', '¡Campeón de la Copa Isla!') : L(`Cup: ${ORD(pos)} place`, `Copa: puesto ${pos}`)) : L('Cup stopped early', 'Copa terminada antes'), stats: [[L('Cup place', 'Puesto'), ORD(pos)], [L('Points', 'Puntos'), mine], [L('Races won', 'Carreras ganadas'), `${wins}/${races}`]], xp, coins, won: full && pos === 1, onAgain: () => title(), share: L(`I finished ${ORD(pos)} in the Island Cup in Island Drift (Inoa Games)! ${location.href}`, `¡Terminé ${ORD(pos)} en la Copa Isla de Island Drift (Inoa Games)! ${location.href}`) });
}
function pause() { if (!G || G.done || document.querySelector('.ig-screen')) return; const live = G.online || G.client; if (!live) { G.paused = true; music && music.stop(); } E.pauseMenu({ extra: live ? `<p class="ig-sub">${L('Online race: the race keeps going while this menu is open.', 'Carrera en línea: la carrera sigue mientras este menú está abierto.')}</p>` : cup ? `<p class="ig-sub">🏆 ${L('Island Cup', 'Copa Isla')} · ${L('Race', 'Carrera')} ${cup.i + 1}/${CUP_ORDER.length}</p>` : '', onResume: () => { if (!live) { G.paused = false; music = E.music(E.SONGS.race); } }, onRestart: () => { if (!G.client) startRace(); } }); }
input.poll(); addEventListener('keydown', e => { if ((e.code === 'Escape' || e.code === 'KeyP') && G && !G.paused) pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G && !G.online && !G.client) pause(); });

/* ---------- title ---------- */
let titleEl = null;
function title() {
  if (room) room.lobby();
  cup = null;
  ['drLeft', 'drItem', 'drDrift', 'drSpeed', 'minimap', 'drWarn'].forEach(id => $(id).hidden = true); if (G) { for (const k of G.karts) scene.remove(k.g); for (const h of G.hazards) scene.remove(h.m); if (G.ghost) scene.remove(G.ghost.m); G = null; } if (engineSnd) engineSnd.g.gain.value = 0;
  buildTrack(TRACKS[S.track]); renderTitle();
  E.say(L('Island Drift! Pick a track and press Play. Hold drift in the corners for a turbo.', '¡Island Drift! Elige una pista y pulsa Jugar. Mantén el derrape en las curvas para un turbo.'), { once: true });
}
function renderTitle() {
  if (titleEl) titleEl.remove();
  const D = k => `${L(DIFF[k])}<small>${L(DIFF[k].sub)}</small>`;
  const extra = `<div class="dr-setup">
    <div class="dr-lbl">${L('Mode', 'Modo')}</div><div class="pick three" id="pM"><button data-m="gp" class="${S.mode === 'gp' ? 'on' : ''}">🏁 ${L('Race', 'Carrera')}<small>${L('3 laps · 5 rivals', '3 vueltas · 5 rivales')}</small></button><button data-m="cup" class="${S.mode === 'cup' ? 'on' : ''}">🏆 ${L('Cup', 'Copa')}<small>${L('4 tracks · points', '4 pistas · puntos')}${S.cupBest ? ' · ' + ORD(S.cupBest) : ''}</small></button><button data-m="tt" class="${S.mode === 'tt' ? 'on' : ''}">⏱ ${L('Time trial', 'Contrarreloj')}<small>${L('Race your ghost', 'Contra tu fantasma')}</small></button></div>
    <div class="dr-lbl">${L('Track', 'Pista')}</div><div class="pick tracks ${S.mode === 'cup' ? 'dim' : ''}" id="pT">${TRACKS.map((t, i) => `<button data-i="${i}" class="${i === S.track ? 'on' : ''}">${t.e} ${tn(t.name)}<small>${tn(t.desc)}${S.bestLap[t.id] ? ` · <span class="rec">${fmt(S.bestLap[t.id])}</span>` : ''}</small></button>`).join('')}</div>
    <div class="dr-lbl">${L('Driver', 'Piloto')}</div><div class="pick drivers" id="pR">${RACERS.map((r, i) => `<button data-i="${i}" class="${i === S.racer ? 'on' : ''}" style="border-left:8px solid #${new THREE.Color(r.tint).getHexString()}">${r.name}<small>${STYLES[r.style].e} ${L(STYLES[r.style]).split(':')[0]}</small></button>`).join('')}</div>
    <div class="dr-lbl">${L('Difficulty', 'Dificultad')}</div><div class="pick three" id="pD">${Object.keys(DIFF).map(k => `<button data-d="${k}" class="${S.diff === k ? 'on' : ''}">${D(k)}</button>`).join('')}</div>
    <p class="ig-sub" id="drOnline" style="margin:0;font-weight:800;color:#0f5c48"></p></div>`;
  const d = E.titleScreen({ party: PARTY, title: 'Island Drift', kicker: L('Inoa Games · Kart racing', 'Inoa Games · Carreras de karts'), lead: L('Race around the islands. Hold drift through corners until the sparks turn orange or purple, then let go for a turbo.', 'Corre por las islas. Mantén el derrape en las curvas hasta que las chispas sean naranjas o moradas y suelta para un turbo.'), how: [['◀▶', L('Steer: A/D, arrows, stick or buttons', 'Girar: A/D, flechas, palanca o botones')], ['💨', L('Drift: hold Shift/K or 💨 while turning', 'Derrape: mantén Shift/K o 💨 al girar')], ['🎁', L('Item: Space/J or 🎁 after a ? box', 'Objeto: Espacio/J o 🎁 tras una caja ?')]], extra, onPlay: () => { titleEl = null; saveS(); if (S.mode === 'cup') startCup(); else startRace(); } });
  titleEl = d;
  const showOnline = () => { const el = document.getElementById('drOnline'); if (!el) return; const n = E.net.role === 'host' ? E.net.pads('player').length : 0; el.textContent = n ? L(`🌐 ${n} online racer${n > 1 ? 's' : ''} ready: press Play to start the race together`, `🌐 ${n} corredor${n > 1 ? 'es' : ''} en línea listo${n > 1 ? 's' : ''}: pulsa Jugar para correr juntos`) : ''; };
  E.net.on('change', showOnline); showOnline();
  const sel = (q, b) => d.querySelectorAll(q).forEach(x => x.classList.toggle('on', x === b));
  d.querySelectorAll('#pT button').forEach(b => b.onclick = () => { S.track = +b.dataset.i; if (S.mode === 'cup') { S.mode = 'gp'; sel('#pM button', d.querySelector('#pM [data-m=gp]')); d.querySelector('#pT').classList.remove('dim'); } sel('#pT button', b); buildTrack(TRACKS[S.track]); saveS(); });
  d.querySelectorAll('#pR button').forEach(b => b.onclick = () => { S.racer = +b.dataset.i; S.picked = true; sel('#pR button', b); saveS(); });
  d.querySelectorAll('#pM button').forEach(b => b.onclick = () => { S.mode = b.dataset.m; sel('#pM button', b); d.querySelector('#pT').classList.toggle('dim', S.mode === 'cup'); saveS(); });
  d.querySelectorAll('#pD button').forEach(b => b.onclick = () => { S.diff = b.dataset.d; sel('#pD button', b); saveS(); });
}
addEventListener('inoa:settings', e => { if (e.detail && e.detail.key === 'lang' && titleEl && titleEl.isConnected) { renderTitle(); } });
if (JOIN) { buildTrack(TRACKS[S.track]); guest.join(); } else { title(); if (new URLSearchParams(location.search).get('online')) setTimeout(() => E.NET.partyPanel(PARTY), 300); }
ld.done(); window.__READY = true;
E.loop((dt) => { update(dt); if (!G || !G.paused || G.done) P.update(dt); updateCamera(dt); updateSnow(dt); R.render(dt); });
window.__GAME = { get G() { return G; }, get pts() { return pts; }, get cup() { return cup; }, get bridge() { return bridge; }, TRACKS, S, R, THREE, startRace, startCup, update, title, updateCamera, net: E.net };
