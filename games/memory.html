    d.innerHTML = `<div class="ig-card"><h2>🐣 ${T('Little ones', 'Peques')}</h2><p class="ig-sub" style="margin:0">${T('Pick a picture to play!', '¡Elige un dibujo para jugar!')}</p>
      <div style="display:grid;gap:12px;justify-items:center;width:100%"><div class="mm-kthemes" id="mmKT"></div><div class="mm-ksize" id="mmKS" role="group" aria-label="${T('How many cards', 'Cuántas cartas')}"></div></div>
      <div style="display:grid;gap:10px;justify-items:center;width:100%"><p class="mm-lbl">${T('Stickers', 'Calcomanías')} · ${S.kids.stickers.length}/${STICKERS.length}</p><div class="mm-stickers" role="img" aria-label="${T(`${S.kids.stickers.length} of ${STICKERS.length} stickers`, `${S.kids.stickers.length} de ${STICKERS.length} calcomanías`)}">${STICKERS.map((s, i) => `<span class="${S.kids.stickers.includes(i) ? '' : 'off'}" aria-hidden="true">${S.kids.stickers.includes(i) ? s : '⭐'}</span>`).join('')}</div>
      <button type="button" class="ig-chipbtn" data-kids-gate="1" id="mmGrown">👪 ${T('Grown-ups', 'Adultos')}</button></div></div>`;
    const kt = d.querySelector('#mmKT');
    ['animals', 'food', 'nature', 'home', 'school', 'colors'].forEach(id => { const th = THEMES.find(t => t.id === id); const b = K.bigButton({ icon: th.e, text: T(th.name), cls: 'mm-kt', onClick: () => { E.audio(); start('kids', { theme: id }); } }); b.dataset.theme = id; kt.appendChild(b); });
    const ks = d.querySelector('#mmKS');
    KIDS_N.forEach(n => { const b = K.bigButton({ icon: '🃏', text: String(n), label: T(`${n} cards`, `${n} cartas`), cls: 'mm-kn', onClick: () => { S.kids.n = n; save(); SFX.click(); K.speak({ en: `${cap1(K.numberWord(n, 'en'))} cards`, es: `${cap1(K.numberWord(n, 'es', 'f'))} cartas` }); draw(); d.querySelector(`.mm-kn[data-n="${n}"]`)?.focus({ preventScroll: true }); } }); b.dataset.n = n; b.setAttribute('aria-pressed', S.kids.n === n); ks.appendChild(b); });
    d.querySelector('#mmGrown').addEventListener('click', grownups);
  };
  draw(); document.body.appendChild(d);
  K.instruct({ en: 'Pick a picture to play!', es: '¡Elige un dibujo para jugar!' });
  setTimeout(() => d.querySelector('.mm-kt')?.focus({ preventScroll: true }), 60);
  return d;
}
// Grown-ups panel: opened only through the parent gate (data-kids-gate on its button); links inside are not gated twice.
function grownups() {
  const d = document.createElement('div'); d.className = 'ig-screen'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.dataset.kidsUnlocked = '1'; d.id = 'mmGrownPanel';
  const draw = () => { d.innerHTML = `<div class="ig-card"><h2>👪 ${T('For grown-ups', 'Para adultos')}</h2><p class="ig-sub">${T('Memory Match saves only stickers, best scores and the daily streak on this device. No names, no chat, no ads.', 'Memory Match solo guarda calcomanías, récords y la racha diaria en este dispositivo. Sin nombres, sin chat, sin anuncios.')}</p>
    <div class="mm-opts2"><button type="button" class="ig-chipbtn ${S.hc ? 'on' : ''}" data-o="hc" aria-pressed="${S.hc}">🔲 ${T('High contrast', 'Alto contraste')}<small>${T('Black and white cards, thick outlines', 'Cartas en blanco y negro, bordes gruesos')}</small></button><button type="button" class="ig-chipbtn" data-o="all">🃏 ${T('All modes', 'Todos los modos')}<small>${T('Words, Classic, Daily board, Two players', 'Palabras, Clásico, Tablero del día, Dos jugadores')}</small></button></div>
    <div class="ig-row"><button type="button" class="ig-btn ghost" data-a="settings">⚙️ ${T('Settings', 'Ajustes')}</button><button type="button" class="ig-btn ghost" data-a="phones">📱 ${T('Phones', 'Teléfonos')}</button></div>
    <div class="ig-row"><a class="ig-btn ghost" href="../index.html">⌂ ${T('All games', 'Todos los juegos')}</a><button type="button" class="ig-btn" data-a="close">${T('Done', 'Listo')}</button></div></div>`;
    d.querySelector('[data-o=hc]').onclick = () => { S.hc = !S.hc; save(); applyHC(); SFX.click(); draw(); };
    d.querySelector('[data-o=all]').onclick = () => { d.remove(); title(); };
    d.querySelector('[data-a=settings]').onclick = () => E.settingsPanel(); d.querySelector('[data-a=phones]').onclick = () => E.NET.partyPanel({}); d.querySelector('[data-a=close]').onclick = () => d.remove(); };
  draw(); document.body.appendChild(d); setTimeout(() => d.querySelector('[data-a=close]')?.focus({ preventScroll: true }), 30); return d;
}
K.guardLinks({ enabled: false });
// language switch from the shared settings panel: rebuild visible text in place
addEventListener('inoa:settings', e => { if (!e.detail || e.detail.key !== 'lang') return; hud(); if (G) G.cards.forEach((c, i) => refresh(i)); if (repeatBtn) repeatBtn.setAttribute('aria-label', T('Hear it again', 'Escúchalo otra vez'));
  const keep = [...document.querySelectorAll('.ig-settings, #mmGrownPanel')]; if (document.querySelector('.ig-title')) { keep.forEach(k => k.remove()); title(); keep.forEach(k => document.body.appendChild(k)); } else if (document.querySelector('.mm-kids')) { keep.forEach(k => k.remove()); kidsHome(); keep.forEach(k => document.body.appendChild(k)); } });

/* ---------------- update loop ---------------- */
function update(dt) {
  pollPads(dt);
  if (!G || G.paused) return;
  if (G.timer && G.started && !G.done && !document.querySelector('.ig-screen')) { G.time += dt; const s = Math.floor(G.time); if (s !== G.lastSec) { G.lastSec = s; const el = document.querySelector('#mmTime b'); if (el) el.textContent = mmss(G.time); if (G.mode === 'daily' && !G.practice && s % 5 === 0) saveDaily(); } }
  if (G.wait > 0) { G.wait -= dt; if (G.wait <= 0) resolveMiss(); }
  if (G.done && G.endT > 0) { G.endT -= dt; if (G.endT <= 0) finish(); }
  if (G.rewardT > 0) { G.rewardT -= dt; if (G.rewardT <= 0) kidsResults(); }
}

/* ---------------- boot ---------------- */
ld.set(1); placeScene(null); S.kidsHome ? kidsHome() : title(); ld.done(); window.__READY = true;
E.loop(dt => { update(dt); R.render(dt); });

// test hooks (headless harness)
const cardView = (c, i) => { const r = c.el ? c.el.getBoundingClientRect() : { left: 0, top: 0, width: 0, height: 0 }; return { i, id: c.it.id, f: c.f, state: c.state, owner: c.owner, x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height, label: c.el ? c.el.getAttribute('aria-label') : '' }; };
window.__GAME = {
  get state() { return G ? { mode: G.mode, n: G.cards.length, cols: LAY.cols, rows: LAY.rows, cardW: LAY.w, cardH: LAY.h, open: G.open.slice(), matched: G.matchedN, moves: G.moves, time: +G.time.toFixed(2), turn: G.turn, scores: G.scores.slice(), combo: G.combo, bestCombo: G.bestCombo, wait: +G.wait.toFixed(2), done: G.done, paused: G.paused, sel: G.sel, kbd: G.kbd, practice: G.practice, resumed: !!G.resumed, opts: G.opts, rewarding: G.rewardT > 0 } : { mode: document.querySelector('.mm-kids') ? 'kidsHome' : 'title' }; },
  S, update, title, kidsHome, layout, setDate: d => { DATE_OVERRIDE = d; }, today,
  start: (mode, o) => start(mode, o || {}, { skipGate: true }),
  flip: i => flip(i), solve: () => solveAll(), resolve: () => resolveMiss(),
  cards: () => G ? G.cards.map(cardView) : [],
  pairOf: i => G ? G.cards.findIndex((c, k) => k !== i && c.it.id === G.cards[i].it.id) : -1,
  wrongFor: i => G ? G.cards.findIndex((c, k) => k !== i && c.state === 'down' && c.it.id !== G.cards[i].it.id) : -1,
  dailyIds: d => dailyDeck(d || today()).map(c => c.it.id),
  board: () => { const r = board.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, vw: innerWidth, vh: innerHeight, sw: document.documentElement.scrollWidth, sh: document.documentElement.scrollHeight }; },
  minTargetPx: () => K.minTargetPx(), gate: () => K.guardStats(), gateOpen: () => K.gateOpen(), lastLine: () => K.lastLine()
};
</script>
</body></html>
