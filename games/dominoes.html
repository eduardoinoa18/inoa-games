<style>
:root{--s0:#ff6b6b;--s1:#4fb3ff;--s2:#ffd166;--s3:#2fd18a;--tw:clamp(40px,11.2vw,60px)}

.dm-setup{display:grid;gap:6px;min-width:0}

.pick button{min-height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;cursor:pointer;padding:6px 8px;font-size:14px;color:var(--ink);line-height:1.15;text-align:center}
.pick button.on{border-color:var(--mint-ink);background:var(--mint)}

.dm-names input{min-height:42px;border-radius:12px;border:2px solid var(--line);padding:0 10px;font:inherit;font-weight:800;box-sizing:border-box;width:100%;user-select:text;-webkit-user-select:text;color:var(--ink);background:#fff}
.dm-rec{font-weight:800;color:var(--mint-ink);font-size:14px;margin:0}
.ig-title .ig-card{max-height:calc(100dvh - 32px);overflow:auto}
.ig-title .ig-card>.ig-row{position:sticky;bottom:-26px;background:var(--paper);padding:8px 0 4px;z-index:2}
@media (orientation:landscape) and (min-width:700px){
  .ig-title .ig-card{width:min(980px,100%);grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);column-gap:22px;row-gap:10px;align-items:start;padding:18px 22px}
  .ig-title .ig-card>*{grid-column:1}
  .ig-title .ig-card>.dm-setup{grid-column:2;grid-row:1/span 9}
  .ig-title .ig-card h1{font-size:40px}
  .ig-title .ig-card>.ig-row{position:static;padding:0}
  .ig-title .ig-how div{font-size:13px;padding:6px 8px}
}
/* seats around the table */
.dm-seat{position:fixed;z-index:19;display:flex;align-items:center;gap:6px;background:rgba(255,248,238,.93);color:var(--ink);border-radius:16px;padding:6px 10px;font-weight:800;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);border-left:6px solid var(--c);pointer-events:none;max-width:44vw;transition:transform .2s,box-shadow .2s}
.dm-seat .e{font-size:18px}.dm-seat .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.dm-seat .k{font-family:var(--f-d);font-size:12px;background:var(--ink);color:#fff;border-radius:9px;padding:2px 6px;white-space:nowrap}
.dm-seat .st{font-size:11px;color:#4c5868;white-space:nowrap}
.dm-seat.turn{box-shadow:0 0 0 3px #fff,0 0 22px 4px var(--c);transform:scale(1.06)}
.dm-seat.top{left:50%;top:max(60px,calc(env(safe-area-inset-top) + 52px));transform:translateX(-50%)}.dm-seat.top.turn{transform:translateX(-50%) scale(1.06)}
.dm-seat.left{left:max(8px,env(safe-area-inset-left));top:42%}.dm-seat.right{right:max(8px,env(safe-area-inset-right));top:42%}

@keyframes dmPop{from{opacity:0;transform:translateX(-50%) scale(.6)}}

.dm-who b{font-family:var(--f-d);color:var(--c,#fff)}
.dm-who .yt{background:var(--sun);color:var(--ink);text-shadow:none;border-radius:12px;padding:3px 10px;font-family:var(--f-d);font-size:13px;animation:dmPulse 1.2s ease-in-out infinite alternate}

.dm-round{display:grid;gap:6px}
.dm-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 10px;font-weight:800}

.dm-row i{width:12px;height:12px;border-radius:50%;display:inline-block;background:var(--c)}
.dm-row .mini{display:flex;flex-wrap:wrap;gap:3px}.dm-row .mini svg{width:16px;height:32px;background:#fffaf0;border-radius:4px;box-shadow:0 0 0 1px #d9cdb3}

.dm-big{font-family:var(--f-d);font-size:20px;text-align:center;color:var(--mint-ink)}
.ig-hud .dm-sc{gap:8px}.ig-hud .dm-sc span{display:inline-flex;align-items:center;gap:4px}.ig-hud .dm-sc i{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--c)}
@media (max-width:640px){.dm-seat{font-size:12px;padding:5px 8px;gap:4px}.dm-seat .n{max-width:70px}.dm-seat .st{display:none}.dm-seat.left,.dm-seat.right{top:34%}.ig-hud .dm-opt{display:none}}

{

/* ---- tiles: rounded ivory body + a canvas face with pips (cached per tile + colour mode) ---- */
const TILE_GEO = new RoundedBoxGeometry(1, TILE_H, 2, 3, .07);

const XL = 6.4;

/* ======================= main loop ======================= */
function update(dt) {

  for (const ms of tileMeshes.values()) { const a = ms.userData.a, tg = ms.userData.tgt; if (!a || !tg) continue; a.t = Math.min(1, a.t + dt * 2.6 / Math.max(.25, FAST())); const k = 1 - Math.pow(1 - a.t, 3); ms.position.set(lerp(a.from.x, tg.x, k), lerp(a.from.y, TILE_Y, k) + Math.sin(Math.PI * k) * 1.4, lerp(a.from.z, tg.z, k)); let dr = tg.rot - a.r0; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); ms.rotation.y = a.r0 + dr * k; if (a.t >= 1) { ms.userData.a = null; ms.position.set(tg.x, TILE_Y, tg.z); ms.rotation.y = tg.rot; E.tone(1400, .04, 'square', .05); E.noise(.06, .14, 2400, 2); P.burst(new THREE.Vector3(tg.x, .2, tg.z), { color: 0xfff1d0, n: 8, speed: 2, up: 1.5, size: .18, life: .4, gravity: 6 }); } }

    for (const k in G.bubbles) { G.bubbles[k].t -= dt; if (G.bubbles[k].t <= 0) { delete G.bubbles[k]; renderSeats(); } }
    if (G.m.phase === 'turns' && !document.querySelector('.dm-card')) {
      G.wait -= dt;
      const s = G.m.turn(), seat = G.seats[s];
      if (G.wait <= 0) {
        if (seat.kind === 'bot' || (G.auto && seat.kind === 'local' && (G.revealed || locals().length < 2))) { G.think -= dt; if (G.think <= 0) { G.m.botAct(s, seat.kind === 'bot' ? seat.skill : 'sharp'); } }
        else if (seat.kind === 'local' && G.revealed && !G.m.pending) { const lm = G.m.legal(s); if (lm.length === 1 && lm[0].type === 'pass') { G.think -= dt; if (G.think <= 0) G.m.act(s, lm[0], 'local'); } }
        else if (seat.kind === 'phone' || seat.kind === 'online') { const p = E.net.players.find(x => x.slot === seat.slot); if (!p || !p.connected) { G.away += dt; if (G.away > 12) { E.toast(L(`${seat.name}'s phone is away: a bot plays for now`, `El teléfono de ${seat.name} no está: juega un bot por ahora`), 2200); G.away = 0; G.m.botAct(s, 'normal'); } } else G.away = 0; }
      }

}
/* camera: frames the line between the HUD and your hand, on landscape and portrait */
let camT = { x: 0, z: 0, d: 30 }, lastOff = '';
function updateCamera(dt) {
  let minx = -5.5, maxx = 5.5, minz = -3.2, maxz = 3.2;
  for (const ms of tileMeshes.values()) { const tg = ms.userData.tgt; if (!tg) continue; minx = Math.min(minx, tg.x - 1.4); maxx = Math.max(maxx, tg.x + 1.4); minz = Math.min(minz, tg.z - 1.4); maxz = Math.max(maxz, tg.z + 1.4); }
  const trayH = $('tray').hidden ? 70 : $('tray').offsetHeight, topH = innerWidth < innerHeight ? 110 : 64, H = innerHeight, Wd = innerWidth;
  const vis = clamp((H - trayH - topH) / H, .35, 1), tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2), tilt = 1.12;

}

    <div class="dm-lbl">${L('First to', 'Gana quien llegue a')}</div><div class="pick four" id="pG">${D.TARGETS.map(t => b(S.target === t, `data-g="${t}"`, `${t}`)).join('')}</div>
    <div class="dm-lbl">${L('Bots', 'Bots')}</div><div class="pick three" id="pS">${Object.keys(SKILL).map(k => b(S.skill === k, `data-s="${k}"`, `${SKILL[k].e} ${L(SKILL[k])}<small>${L(...SKILL[k].sub)}</small>`)).join('')}</div>
    <div class="dm-lbl">${L('People on this screen', 'Personas en esta pantalla')}</div><div class="pick four" id="pH">${[0, 1, 2, 3, 4].filter(n => n <= S.players && (n > 0 || nPh)).map(n => b(S.locals === n, `data-h="${n}"`, n === 0 ? `📺 0<small>${L('phones only', 'solo teléfonos')}</small>` : n === 1 ? `🙂 1<small>${L('vs bots', 'contra bots')}</small>` : `👥 ${n}<small>${L('pass the device', 'pasan el aparato')}</small>`)).join('')}</div>
    <div class="dm-names" id="pNames" ${S.locals > 1 ? '' : 'hidden'}>${[0, 1, 2, 3].map(i => `<input data-i="${i}" maxlength="12" value="${esc(S.names[i])}" aria-label="${L('Player', 'Jugador')} ${i + 1}" style="border-left:6px solid ${SEATC[i]}" ${i < S.locals ? '' : 'hidden'}>`).join('')}</div>
    <div class="pick three" id="pX">${b(S.hints, 'data-x="hints"', `💡 ${L('Hints', 'Pistas')}<small>${L('glow playable tiles', 'fichas que caben')}</small>`)}${b(S.color, 'data-x="color"', `🎨 ${L('Colour pips', 'Puntos de color')}`)}${b(S.capicua, 'data-x="capicua"', `⭐ ${L('Capicúa', 'Capicúa')} +25<small>${L('last tile fits both ends', 'la última cabe en las dos')}</small>`)}</div>
    <p class="dm-rec" id="pPh">${phoneLine()}</p>
    ${S.played ? `<p class="dm-rec">🏆 ${L(`Matches won: ${S.wins} of ${S.played}`, `Partidas ganadas: ${S.wins} de ${S.played}`)}${S.best ? ` · ${L('best round', 'mejor ronda')} +${S.best}` : ''}</p>` : ''}</div>`;
  const d = E.titleScreen({ party: PARTY(), title: L('Dominoes', 'Dominó'), kicker: L('Inoa Games · Card Room', 'Inoa Games · Sala de juegos'), lead: L('The classic double-six game for 2–4 players: match the ends, play your last tile, or have the fewest pips when nobody can move.', 'El clásico doble seis para 2–4 jugadores: junta las puntas, juega tu última ficha o ten menos puntos cuando nadie pueda jugar.'),
    how: [['🔢', L('Match a number on either end of the line', 'Junta un número con una de las dos puntas')], ['👆', L('Tap a tile. If it fits both ends, pick one. Keys: ◀ ▶ and Space', 'Toca una ficha. Si cabe en las dos puntas, elige una. Teclas: ◀ ▶ y Espacio')], ['🏆', L('Empty your hand, then score the pips left in the other hands', 'Vacía tu mano y anota los puntos de las otras manos')]], extra, onPlay: () => { titleEl = null; save(); start(); } });
  titleEl = d;
  const sel = (q, el) => d.querySelectorAll(q).forEach(x => { const on = x === el; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
  d.querySelectorAll('#pL button').forEach(x => x.onclick = () => { SFX.click(); E.setSetting('lang', x.dataset.l); });
  d.querySelectorAll('#pM button').forEach(x => x.onclick = () => { S.mode = x.dataset.m; sel('#pM button', x); SFX.click(); save(); });
  d.querySelectorAll('#pN button').forEach(x => x.onclick = () => { S.players = +x.dataset.n; if (S.locals > S.players) S.locals = S.players; SFX.click(); save(); renderTitle(); });
  d.querySelectorAll('#pT button').forEach(x => x.onclick = () => { S.teams = x.dataset.t === '1'; sel('#pT button', x); SFX.click(); save(); });
  d.querySelectorAll('#pG button').forEach(x => x.onclick = () => { S.target = +x.dataset.g; sel('#pG button', x); SFX.click(); save(); });
  d.querySelectorAll('#pS button').forEach(x => x.onclick = () => { S.skill = x.dataset.s; sel('#pS button', x); SFX.click(); save(); });
  d.querySelectorAll('#pH button').forEach(x => x.onclick = () => { S.locals = +x.dataset.h; sel('#pH button', x); $('pNames').hidden = S.locals < 2; d.querySelectorAll('#pNames input').forEach(inp => inp.hidden = +inp.dataset.i >= S.locals); SFX.click(); save(); });
  d.querySelectorAll('#pNames input').forEach(inp => { inp.addEventListener('input', () => { S.names[+inp.dataset.i] = inp.value.replace(/[<>]/g, '').trim() || `P${+inp.dataset.i + 1}`; save(); }); inp.addEventListener('keydown', e => e.stopPropagation()); });
  d.querySelectorAll('#pX button').forEach(x => x.onclick = () => { const k = x.dataset.x; S[k] = !S[k]; x.classList.toggle('on', S[k]); x.setAttribute('aria-pressed', S[k]); SFX.click(); save(); if (k === 'color') demoTable(); });
}
E.net.on('change', () => { if (titleEl && titleEl.isConnected && !document.querySelector('.inoa-pp')) renderTitle(); else if (titleEl && titleEl.isConnected) { const el = document.getElementById('pPh'); if (el) el.textContent = phoneLine(); } });
function phoneLine() {
  const n = E.net.role === 'host' ? E.net.pads('pad').length : 0, o = room ? room.players.length : 0;
  return [n ? L(`📱 ${n} phone${n > 1 ? 's' : ''} connected: each one is a player with a secret hand`, `📱 ${n} teléfono${n > 1 ? 's' : ''}: cada uno es un jugador con mano secreta`) : '', o ? L(`🌐 ${o} online player${o > 1 ? 's' : ''} ready: they play on their own screen`, `🌐 ${o} jugador${o > 1 ? 'es' : ''} en línea: juega${o > 1 ? 'n' : ''} en su pantalla`) : ''].filter(Boolean).join(' · ');
}
addEventListener('inoa:settings', e => { if (!e.detail || e.detail.key !== 'lang') return; document.title = L('Dominoes', 'Dominó'); if (titleEl && titleEl.isConnected) renderTitle(); else if (G) { renderAll(); const rc = document.querySelector('.dm-card .dm-round'); if (rc) roundCard(); } });
// the title table: a few tiles laid out as a little line
function demoTable() {
  for (const m of tileMeshes.values()) scene.remove(m); tileMeshes.clear(); for (const k in FACES) { FACES[k].map.dispose(); FACES[k].dispose(); delete FACES[k]; }
  const line = [[3, 6], [6, 6], [6, 1], [1, 4], [4, 4], [4, 2]].map(t => ({ t, inner: t[0], outer: t[1], end: 'R' })); line[0].end = 'L'; line[0].inner = 3; line[0].outer = 6;
  const lay = layoutLine(line); line.forEach((e, i) => { const ms = makeTile(e.t); ms.position.set(lay.out[i].x - 4, TILE_Y, lay.out[i].z); ms.rotation.y = lay.out[i].rot; ms.userData.tgt = { ...lay.out[i], x: lay.out[i].x - 4 }; scene.add(ms); tileMeshes.set(D.key(e.t), ms); });
}

/* ======================= boot ======================= */
document.title = L('Dominoes', 'Dominó');
ld.set(1); if (JOIN) { demoTable(); guest.join(); } else title_();
if (!JOIN && new URLSearchParams(location.search).get('online')) setTimeout(() => E.NET.partyPanel(PARTY()), 300);
ld.done(); window.__READY = true;
E.loop(dt => { update(dt); R.render(dt); });
window.__GAME = {
  get G() { return G; }, get m() { return G && G.m; }, get state() { return G && G.m.state; }, get phase() { return G ? G.m.phase : 'title'; }, get resultsCount() { return resultsCount; }, S, D, CR, R, THREE,
  start, update, title: title_, tapTile, localAction, roundCard, finishMatch, next: () => { const b = document.querySelector('.dm-card [data-a=next]'); if (b) b.click(); },
  legal: s => G.m.legal(s), act: (s, mv, from = 'local') => G.m.act(s, mv, from), rawAct: mv => guest && guest.act('act', { move: mv }), auto(v) { if (G) G.auto = !!v; },
  fast(v = true) { window.__DM_FAST = !!v; },
  // run the simulation n steps of dt (tests): bots + auto-locals keep playing; round cards are clicked through when skipCards is set
  run(n = 600, dt = 1 / 30, { skipCards = false } = {}) { for (let i = 0; i < n; i++) { update(dt); if (skipCards && document.querySelector('.dm-card [data-a=next]') && G && G.m.phase === 'roundEnd') window.__GAME.next(); if (!G || G.done || (G.m.phase === 'matchEnd' && document.querySelector('.dm-card'))) break; } return G && G.m.phase; }
};
</script>
