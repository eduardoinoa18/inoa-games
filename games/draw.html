  <div id="pPl"><p class="ig-sub" style="margin-bottom:6px">${es ? 'Jugadores' : 'Players'}</p><div class="pk" id="pN">${[2, 3, 4, 5, 6, 8].map(n => `<button data-n="${n}" class="${n === S.players ? 'on' : ''}">${n}</button>`).join('')}</div><div class="names" style="margin-top:6px">${S.names.map((nm, i) => `<input data-i="${i}" maxlength="10" value="${esc(nm)}" style="border-left:6px solid ${PCOL[i]}" ${i < S.players ? '' : 'hidden'} aria-label="${esc(T().player(i + 1))}">`).join('')}</div></div>
  <div id="pRd"><p class="ig-sub" style="margin-bottom:6px">${es ? 'Ronda' : 'Round'}</p><div class="pk" id="pS">${[45, 60, 90].map(n => `<button data-s="${n}" class="${S.roundSec === n ? 'on' : ''}">⏱ ${n}s</button>`).join('')}${[1, 2, 3].map(n => `<button data-r="${n}" class="${S.rounds === n ? 'on' : ''}">🔁 ${n}×</button>`).join('')}<button data-h="1" class="${S.hints ? 'on' : ''}">💡 ${es ? 'Pistas' : 'Hints'}</button></div></div>
  <div id="pWd"><p class="ig-sub" style="margin-bottom:6px">${es ? 'Palabras' : 'Words'} · <span id="pT"></span></p><div class="pk" id="pD">${[[0, es ? 'Todas' : 'Mixed'], [1, es ? 'Fácil' : 'Easy'], [2, es ? 'Media' : 'Medium'], [3, es ? 'Difícil' : 'Hard']].map(([d, l]) => `<button data-d="${d}" class="${S.diff === d ? 'on' : ''}">${l}</button>`).join('')}</div>
  <div class="pk cats" id="pC" style="margin-top:6px">${[['all', '🎲', es ? 'Todas las categorías' : 'All categories'], ...Object.entries(CATS).map(([k, v]) => [k, v[2], v[es ? 1 : 0]])].map(([k, ic, nm]) => `<button data-c="${k}" class="${S.cat === k ? 'on' : ''}" title="${esc(nm)}" aria-label="${esc(nm)}">${ic}</button>`).join('')}</div></div>

  const how = es ? [['✏️', 'Dibuja con el dedo, el mouse o un lápiz (con presión). Lápiz, cubeta de pintura, figuras y calcomanías; deshacer y rehacer. Toque con dos dedos = deshacer'], ['⌨️', 'Teclas: Z deshacer, Y rehacer, E borrador, D lápiz, F cubeta, S figuras, T calcomanías, 1-3 grosor, [ ] color, Enter listo'], ['🎮', 'Control: palanca + A dibuja, B deshacer, X borrador, LB/RB color, LT/RT grosor, R3 herramienta, Y ver, Select listo; la cruceta mueve los menús'], ['🙈', 'Pasen el aparato: solo quien dibuja ve la palabra. Con pistas, aparecen letras a mitad del tiempo'], ['🖼️', 'Tus dibujos se guardan solo en este aparato: galería, dibujo del día y tarjetas para compartir']] : [['✏️', 'Draw with finger, mouse or stylus (pressure works). Pencil, fill bucket, shapes and stickers; undo and redo. Two-finger tap = undo'], ['⌨️', 'Keys: Z undo, Y redo, E eraser, D pencil, F fill, S shapes, T stickers, 1-3 size, [ ] colour, Enter done'], ['🎮', 'Gamepad: stick + A to draw, B undo, X eraser, LB/RB colour, LT/RT size, R3 tool, Y peek, Select done; D-pad moves through menus'], ['🙈', 'Pass the device: only the drawer sees the word. With hints on, letters appear at half time'], ['🖼️', 'Your drawings stay on this device: gallery, daily doodles and share cards']];
  const d = locScreen(E.titleScreen({ party: { label: es ? 'Adivinar con teléfonos' : 'Guess with phones', hint: es ? 'En modo Fiesta, cada teléfono es un jugador: quien dibuja ve la palabra en su teléfono y los demás adivinan en el suyo.' : 'In Party mode each phone is a player: the drawer sees the word on their phone, everyone else guesses on theirs.' }, title: 'Draw the Pact', kicker: es ? 'Inoa Games · Dibuja y adivina' : 'Inoa Games · Draw & guess', lead: es ? 'Un estudio de arte acogedor para dibujar, adivinar y reír juntos en el mismo aparato.' : 'A cozy art studio for drawing, guessing and laughing together on one device.', how, extra, onPlay: () => { save(); E.say(es ? '¡A dibujar!' : 'Let’s draw!', { lang: S.lang }); start(); } }));
  wideTitle(d);
  const sync = () => {
    const m = S.mode; $('pPl').hidden = !usesPlayers(m); $('pRd').hidden = !usesRound(m); $('pWd').hidden = !usesWords(m);
    const min = minPlayers(m); if (S.players < min) S.players = min;
    d.querySelectorAll('#pN button').forEach(b => { b.classList.toggle('on', +b.dataset.n === S.players); b.disabled = +b.dataset.n < min; b.style.opacity = +b.dataset.n < min ? .4 : 1; });
    d.querySelectorAll('.names input').forEach(inp => inp.hidden = +inp.dataset.i >= S.players);
    $('pT').textContent = `${S.cat === 'all' ? '' : catName(S.cat) + ' · '}${wordPool().length} ${es ? 'palabras' : 'words'}`;
    let info = I(m, 5); if (m === 'daily') { const did = dailyList().some(x => x.day === dayKey()); info += ` 🔥 ${dailyStreak()}${did ? (es ? ' · ✓ hoy ya dibujaste' : ' · ✓ drawn today') : ''}`; }
    if (m === 'team') { const n = S.players; info += es ? ` (${Math.ceil(n / 2)} contra ${Math.floor(n / 2)})` : ` (${Math.ceil(n / 2)} vs ${Math.floor(n / 2)})`; }
    $('pInfo').textContent = info;
  };
  d.querySelectorAll('#pM button').forEach(b => b.onclick = () => { S.mode = b.dataset.m; d.querySelectorAll('#pM button').forEach(x => x.classList.toggle('on', x === b)); sync(); SFX.click(); E.say(I(S.mode, 1), { lang: S.lang }); });
  d.querySelectorAll('#pN button').forEach(b => b.onclick = () => { S.players = +b.dataset.n; sync(); SFX.click(); });
  d.querySelectorAll('#pS [data-s]').forEach(b => b.onclick = () => { S.roundSec = +b.dataset.s; d.querySelectorAll('#pS [data-s]').forEach(x => x.classList.toggle('on', x === b)); SFX.click(); });
  d.querySelectorAll('#pS [data-r]').forEach(b => b.onclick = () => { S.rounds = +b.dataset.r; d.querySelectorAll('#pS [data-r]').forEach(x => x.classList.toggle('on', x === b)); SFX.click(); });
  d.querySelector('#pS [data-h]').onclick = e => { S.hints = !S.hints; e.currentTarget.classList.toggle('on', S.hints); SFX.click(); };
  d.querySelectorAll('#pD button').forEach(b => b.onclick = () => { S.diff = +b.dataset.d; d.querySelectorAll('#pD button').forEach(x => x.classList.toggle('on', x === b)); sync(); SFX.click(); });
  d.querySelectorAll('#pC button').forEach(b => b.onclick = () => { S.cat = b.dataset.c; d.querySelectorAll('#pC button').forEach(x => x.classList.toggle('on', x === b)); sync(); SFX.click(); });
  d.querySelectorAll('#pL [data-l]').forEach(b => b.onclick = () => { S.lang = b.dataset.l; save(); d.remove(); title(); });
  d.querySelector('#pL [data-g]').onclick = () => { save(); SFX.click(); openGallery('sketch'); };
  d.querySelectorAll('.names input').forEach(inp => { inp.addEventListener('input', () => { S.names[+inp.dataset.i] = inp.value.trim() || `P${+inp.dataset.i + 1}`; }); inp.addEventListener('keydown', e => e.stopPropagation()); });
  sync();
}
function wideTitle(d) { const card = d.querySelector('.ig-card'); card.classList.add('ttl-scroll', 'tt-wide'); const kids = [...card.children]; const L = document.createElement('div'), Rr = document.createElement('div'); L.className = Rr.className = 'tt-col'; kids.forEach(k => (k.matches('.ig-kicker,h1,.ig-sub,.ig-how') ? L : Rr).appendChild(k)); card.append(L, Rr); }

clearPad(); title(); ld.done(); window.__READY = true;
E.loop((dt) => { if (!window.__HOLD) update(dt); R.render(dt); });
window.__GAME = { get G() { return G; }, S, D, WORDS, start, update, title, autoDraw, undo, clearAll, warm: () => { R.render(1 / 60); R.renderer.getContext().finish(); },
  guessed: i => { if (G.phase !== 'draw') return; partyWho(); document.querySelector(`.dw-chips button[data-i="${i}"]`)?.click(); },

  hint: () => (document.querySelector('#dwPrompt .dw-hint') || {}).textContent || '', choices: () => [...document.querySelectorAll('#dwTools [data-o]')].map(b => b.textContent) };
