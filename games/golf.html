<div class="gf-tray" id="tray" hidden><div class="gf-who" id="who" aria-live="polite"></div><div class="gf-msg" id="msg"></div><div class="gf-play"><div class="gf-piles" id="piles" role="group"></div><div class="gf-grid" id="grid" role="group"></div></div></div>
<script type="module">
import * as E from '../engine/inoa3d.js';
import * as CR from '../engine/cardroom.js';
import * as CARDS from '../engine/cards.js';
import * as GR from './golf-rules.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const { THREE, clamp, lerp, SFX, $ } = E;
const L = (en, es) => E.L(en, es);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ======================= settings + save (E.store 'inoa.golf', small) ======================= */
const SKEY = 'inoa.golf';
// Online on separate screens (engine/room.js): ?join=CODE = this screen takes a seat at someone else's table
const JOIN = new URLSearchParams(location.search).get('join');
const DEF_NAMES = ['Ana', 'Leo', 'Mia', 'Rafa'];
const S = Object.assign({ players: 4, holes: 9, skill: 'normal', locals: 1, names: DEF_NAMES.slice(), jokers: false, hints: false, badges: true, wins: 0, played: 0, bestHole: null, pairs: 0 }, E.store.get(SKEY, {}));

const save = () => E.store.set(SKEY, { players: S.players, holes: S.holes, skill: S.skill, locals: S.locals, names: S.names.slice(0, 4).map(n => String(n).slice(0, 12)), jokers: S.jokers, hints: S.hints, badges: S.badges, wins: S.wins, played: S.played, bestHole: S.bestHole, pairs: S.pairs });
const BOTS = [{ n: 'Coral', e: '🐚' }, { n: 'Pip', e: '🐧' }, { n: 'Nico', e: '🌴' }, { n: 'Lupe', e: '🦜' }];
const SEATC = ['#ff6b6b', '#4fb3ff', '#ffd166', '#2fd18a'];
const SKILL = { chill: { e: '🐢', en: 'Chill', es: 'Tranquilo', sub: ['hints on', 'con pistas'] }, normal: { e: '🙂', en: 'Normal', es: 'Normal', sub: ['steady', 'parejo'] }, sharp: { e: '🔥', en: 'Sharp', es: 'Astuto', sub: ['counts cards', 'cuenta cartas'] } };
const hintsOn = () => !!G && (G.opts.skill === 'chill' || S.hints);
const FAST = () => window.__GF_FAST ? .04 : 1;
const fmt = v => v < 0 ? '−' + (-v) : String(v);
const sgn = v => v > 0 ? '+' + v : v < 0 ? '−' + (-v) : '0';
const cname = c => CARDS.cardName(c, E.lang());

/* ======================= renderer + scene (procedural: no external models) ======================= */
const ld = E.loading(L('Six-Card Golf', 'Golf de seis cartas'), L('Shuffling the cards…', 'Barajando las cartas…'));
const R = E.createRenderer($('gl'), { fov: 38, portraitFov: 52, shadowSize: 16, far: 260 });
const { scene, camera, sun } = R;
R.setLook({ background: 0x22313f, fog: 0x22313f, fogNear: 70, fogFar: 160, sun: 1.4, sunColor: 0xfff0d6, hemi: .62, skyHor: 0xe6f2ff, ground: 0x6b4a30, exposure: 1, env: .22, bloom: .1, bloomThreshold: .93 });
R.setEnv(R.pmrem.fromScene(new RoomEnvironment(), .04).texture);
sun.position.set(6, 26, 12); sun.target.position.set(0, 0, 0); sun.target.updateMatrixWorld();
ld.set(.3);
const TW = 27, TD = 22, FELT_Y = .07, CW = 1.5, CH = 2.1, CT = .035, CARD_Y = FELT_Y + CT / 2 + .005;
{
  const top = new THREE.Mesh(new RoundedBoxGeometry(TW, .7, TD, 4, .32), E.pbr('wood', 0x7d4e30, [5, 5])); top.position.y = -.33; top.receiveShadow = true; top.castShadow = true; scene.add(top);
  const felt = new THREE.Mesh(new RoundedBoxGeometry(TW - 2.4, .12, TD - 2.4, 3, .05), E.pbr('fabric', 0x23606e, [7, 6])); felt.position.y = .01; felt.receiveShadow = true; scene.add(felt);
  const legM = E.pbr('wood', 0x5e3a24, [1, 3]); for (const [x, z] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { const lg = new THREE.Mesh(new THREE.BoxGeometry(1.1, 9, 1.1), legM); lg.position.set(x * (TW / 2 - 1.6), -4.9, z * (TD / 2 - 1.6)); lg.castShadow = true; scene.add(lg); }
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(180, 180), E.pbr('wood', 0x9a6a46, [20, 20])); floor.rotation.x = -Math.PI / 2; floor.position.y = -9.4; floor.receiveShadow = true; scene.add(floor);
  // a little golf flag in a cup of pencils and a score pad (original props)
  const pad = new THREE.Mesh(new THREE.BoxGeometry(2.2, .08, 2.8), E.mat(0xfff6dc)); pad.position.set(TW / 2 - 2.4, FELT_Y + .04, TD / 2 - 2.6); pad.rotation.y = -.2; pad.receiveShadow = true; scene.add(pad);
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(.5, .45, 1.1, 18), E.mat(0xe2443a, { roughness: .5 })); cup.position.set(-TW / 2 + 2.2, FELT_Y + .55, TD / 2 - 2.2); cup.castShadow = true; scene.add(cup);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, 2.6, 8), E.mat(0xf2f2f2)); pole.position.set(-TW / 2 + 2.2, FELT_Y + 1.6, TD / 2 - 2.2); scene.add(pole);
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(.9, .55), new THREE.MeshStandardMaterial({ color: 0xffd166, side: THREE.DoubleSide })); flag.position.set(-TW / 2 + 2.65, FELT_Y + 2.6, TD / 2 - 2.2); scene.add(flag);
  const bulbM = new THREE.MeshStandardMaterial({ color: 0xffe2a0, emissive: 0xffc86b, emissiveIntensity: 1.3 });
  for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2, b = new THREE.Mesh(new THREE.SphereGeometry(.28, 10, 8), bulbM); b.position.set(Math.cos(a) * 24, 9 + Math.sin(i * 1.7) * .6, Math.sin(a) * 21); scene.add(b); }
}
ld.set(.6);

/* ---- cards: a thin rounded body + a canvas face on top + the back underneath (face down = turned over on z) ---- */
const BODY_GEO = new RoundedBoxGeometry(CW, CT, CH, 2, .012);
const FACE_GEO = new THREE.PlaneGeometry(CW * .995, CH * .995).rotateX(-Math.PI / 2); // canvas top → −z
const BACKF_GEO = new THREE.PlaneGeometry(CW * .995, CH * .995).rotateX(Math.PI / 2).rotateY(Math.PI);
const BODY = new THREE.MeshStandardMaterial({ color: 0xfffaf0, roughness: .5 });
const TEX = {};
function cardTex(c) {
  const k = c ? `${c.s}${c.r}:${S.badges ? 1 : 0}` : 'back'; if (TEX[k]) return TEX[k];
  const cv = document.createElement('canvas'); cv.width = 200; cv.height = 280; const g = cv.getContext('2d');
  if (c) CARDS.drawCard(g, c, 200, 280, { badge: S.badges ? fmt(GR.value(c)) : null }); else CARDS.drawBack(g, 200, 280);
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 4;
  return TEX[k] = new THREE.MeshStandardMaterial({ map: tx, roughness: .45, transparent: true, alphaTest: .5, polygonOffset: true, polygonOffsetFactor: -2 });
}
function makeCard(c) {
  const g = new THREE.Group(); const body = new THREE.Mesh(BODY_GEO, BODY); body.castShadow = true; body.receiveShadow = true; g.add(body);
  const face = new THREE.Mesh(FACE_GEO, cardTex(c && c.r != null ? c : null)); face.position.y = CT / 2 + .002; g.add(face);
  const back = new THREE.Mesh(BACKF_GEO, cardTex(null)); back.position.y = -CT / 2 - .002; g.add(back);
  g.userData.face = face; g.userData.cid = c && c.id; return g;
}
// the stock: a block of card backs whose height follows the count
const stockG = new THREE.Group(); scene.add(stockG);
const stockBody = new THREE.Mesh(new THREE.BoxGeometry(CW, 1, CH), BODY); stockBody.castShadow = true; stockBody.receiveShadow = true; stockG.add(stockBody);
const stockTop = new THREE.Mesh(FACE_GEO, cardTex(null)); stockG.add(stockTop);
const P = new E.Particles(scene, { capacity: 500 });
// glow under the piles when it is your turn to draw
const glowM = new THREE.MeshBasicMaterial({ color: 0x7dffd8, transparent: true, opacity: .4, depthWrite: false, blending: THREE.AdditiveBlending });
const pileGlow = [0, 1].map(() => { const m = new THREE.Mesh(new THREE.PlaneGeometry(CW + .5, CH + .5).rotateX(-Math.PI / 2), glowM); m.visible = false; m.renderOrder = 3; scene.add(m); return m; });

/* ======================= game state ======================= */
let G = null, hudEl = null, music = null, titleEl = null, resultsCount = 0;
const meshes = new Map(); // card id → group
const input = E.createInput({ surface: $('gl') });
const locals = () => G ? G.seats.filter(s => s.kind === 'local') : [];
const mySeat = () => { if (!G) return null; const l = G.seats.findIndex(s => s.kind === 'local'); return l >= 0 ? l : null; };
const trayOn = () => !!G && G.seats[G.viewSeat]?.kind === 'local' && G.m.phase !== 'lobby';
const isPortrait = () => innerWidth / innerHeight < 1.1;

function clearTable() { for (const m of meshes.values()) scene.remove(m); meshes.clear(); stockG.visible = false; pileGlow.forEach(m => m.visible = false); }

function start(o = {}) {
  closeCards(); if (titleEl) { titleEl.remove(); titleEl = null; }
  const players = clamp(o.players ?? S.players, 2, 4), opts = { players, holes: o.holes ?? S.holes, skill: o.skill ?? S.skill, jokers: !!(o.jokers ?? S.jokers) };
  const phones = o.phones === false || E.net.role !== 'host' ? [] : E.net.pads('pad').slice(0, 4), online = o.phones === false || !room ? [] : room.players.slice(0, 3);
  let nLoc = clamp(o.locals ?? S.locals, 0, players); const nPh = Math.min(phones.length, players - nLoc), nOn = Math.min(online.length, players - nLoc - nPh); if (nLoc + nPh + nOn === 0) nLoc = 1;
  const taken = [...S.names.slice(0, nLoc), ...phones.slice(0, nPh).map(p => String(p.name || '')), ...online.slice(0, nOn).map(p => String(p.name || ''))].map(n => n.toLowerCase());
  const botNames = CR.shuffle(BOTS.filter(b => !taken.includes(b.n.toLowerCase())).map(b => b.n)).concat(BOTS.map(b => b.n + ' 2'));
  const seats = CR.makeSeats({ players, locals: nLoc, phones: phones.slice(0, nPh), online: online.slice(0, nOn), names: S.names, botNames, skill: opts.skill });
  seats.forEach((s, i) => { s.color = SEATC[i]; s.emoji = s.kind === 'bot' ? (BOTS.find(b => s.name.startsWith(b.n)) || BOTS[0]).e : s.kind === 'phone' ? '📱' : s.kind === 'online' ? '🌐' : '🙂'; });
  const m = CR.createMatch(GR.GAME, { seats, opts: { n: players, holes: opts.holes, jokers: opts.jokers }, seed: o.seed });
  if (G && G.ph) G.ph.stop(); if (G && G.on) G.on.stop();
  G = { m, seats, opts, think: .8, viewSeat: Math.max(0, seats.findIndex(s => s.kind === 'local')), revealed: nLoc <= 1, paused: false, flip: false, phoneFlip: {}, phoneNote: {}, bubbles: {}, away: 0, auto: !!o.auto, lastRound: null, wait: 0, stats: { holes: 0, myPairs: 0, holeWins: 0, bestHole: null } };
  m.on('move', onMove); m.on('reject', onReject); m.on('round', onRound);
  G.ph = CR.phoneHands(E.NET, { seats, layout: phoneLayout, onMsg: phoneMsg });
  // players on their own screen get their own view of the table after every move (engine/cardroom.js onlineHost)
  if (seats.some(s => s.kind === 'online')) G.on = CR.onlineHost(room, m);
  if (!hudEl) hudEl = E.shell({ title: 'Six-Card Golf', onPause: pause, buttons: [], party: PARTY() }).hud;
  document.querySelector('.ig-top').hidden = false;
  music && music.stop(); music = E.music(E.SONGS.chill);
  newHole();
  E.say(L('Draw a card, then swap it with one of yours, or discard it and turn a card over. Lowest score wins.', 'Roba una carta y cámbiala por una de las tuyas, o descártala y voltea una carta. Gana el puntaje más bajo.'), { once: true });

  if (mine < 0) { guest.wait(L('This table is full. Waiting for the next game…', 'Esta mesa está llena. Esperando la próxima partida…')); return; }
  if (G && !G.done && G.viewSeat === mine) return; // reconnected: a 'sync' view follows
  guestClear(); clearTable(); // the title's demo cards
  const seats = msg.seats.map((s, i) => ({ ...s, i, was: s.kind, kind: i === mine ? 'local' : 'remote', emoji: i === mine ? '🙂' : s.emoji }));
  const o = msg.opts, opts = { players: o.n, holes: o.holes, skill: 'normal', jokers: !!o.jokers };
  const m = CR.mirrorMatch(GR.GAME, { seats, opts: o, seat: mine, send: move => guest.act('act', { move }) });
  G = { m, seats, opts, think: 0, viewSeat: mine, revealed: true, paused: false, flip: false, phoneFlip: {}, phoneNote: {}, bubbles: {}, away: 0, auto: false, lastRound: null, wait: 0, stats: { holes: 0, myPairs: 0, holeWins: 0, bestHole: null } };
  m.on('move', onMove); m.on('reject', onReject); m.on('round', onRound); m.on('deal', dealt);
  m.on('sync', () => { closeCards(); clearTable(); syncTable(true); if (m.phase === 'turns') beginTurn(); renderAll(); });
  if (!hudEl) hudEl = E.shell({ title: 'Six-Card Golf', onPause: pause, buttons: [], party: false }).hud;
  document.querySelector('.ig-top').hidden = false; music && music.stop(); music = E.music(E.SONGS.chill);
  E.say(L('You are at the table. Lowest score wins.', 'Estás en la mesa. Gana el puntaje más bajo.'), { once: true });
}
function guestClear() { closeCards(); G = null; clearTable(); $('tray').hidden = true; $('banner').hidden = true; $('seats').innerHTML = ''; seatEls = []; if (hudEl) document.querySelector('.ig-top').hidden = true; music && music.stop(); }
function guestIdle(html) { guestClear(); guest.wait(html); }
function title_() {
  closeCards(); if (G && G.ph) G.ph.stop(); if (G && G.on) { G.on.stop(); room.lobby(); } G = null; clearTable(); $('tray').hidden = true; $('banner').hidden = true; $('seats').innerHTML = ''; seatEls = []; if (hudEl) document.querySelector('.ig-top').hidden = true;
  music && music.stop(); music = E.music(E.SONGS.chill); demoTable(); renderTitle();
  E.say(L('Six-Card Golf! Lowest score wins. Press Play.', '¡Golf de seis cartas! Gana el puntaje más bajo. Pulsa Jugar.'), { once: true });
}
function renderTitle() {
  if (titleEl) titleEl.remove();
  const es = E.lang() === 'es', nPh = E.net.role === 'host' ? E.net.pads().length : 0;
  if (S.locals === 0 && !nPh) S.locals = 1;
  const b = (on, attrs, html) => `<button ${attrs} class="${on ? 'on' : ''}" aria-pressed="${!!on}">${html}</button>`;
  const extra = `<div class="gf-setup">
    <div class="gf-lbl">${L('Language', 'Idioma')}</div><div class="pick" id="pL">${b(!es, 'data-l="en"', '🇬🇧 English')}${b(es, 'data-l="es"', '🇪🇸 Español')}</div>
    <div class="gf-lbl">${L('Players at the table', 'Jugadores en la mesa')}</div><div class="pick three" id="pN">${[2, 3, 4].map(n => b(S.players === n, `data-n="${n}"`, `${n}`)).join('')}</div>
    <div class="gf-lbl">${L('Holes', 'Hoyos')}</div><div class="pick three" id="pG">${GR.HOLES.map(h => b(S.holes === h, `data-g="${h}"`, `${h}<small>${h === 3 ? L('quick', 'rápido') : h === 9 ? L('full round', 'ronda completa') : L('medium', 'mediano')}</small>`)).join('')}</div>
    <div class="gf-lbl">${L('Bots', 'Bots')}</div><div class="pick three" id="pS">${Object.keys(SKILL).map(k => b(S.skill === k, `data-s="${k}"`, `${SKILL[k].e} ${L(SKILL[k])}<small>${L(...SKILL[k].sub)}</small>`)).join('')}</div>
    <div class="gf-lbl">${L('People on this screen', 'Personas en esta pantalla')}</div><div class="pick four" id="pH">${[0, 1, 2, 3, 4].filter(n => n <= S.players && (n > 0 || nPh)).map(n => b(S.locals === n, `data-h="${n}"`, n === 0 ? `📺 0<small>${L('phones only', 'solo teléfonos')}</small>` : n === 1 ? `🙂 1<small>${L('vs bots', 'contra bots')}</small>` : `👥 ${n}<small>${L('pass the device', 'pasan el aparato')}</small>`)).join('')}</div>
    <div class="gf-names" id="pNames" ${S.locals > 1 ? '' : 'hidden'}>${[0, 1, 2, 3].map(i => `<input data-i="${i}" maxlength="12" value="${esc(S.names[i])}" aria-label="${L('Player', 'Jugador')} ${i + 1}" style="border-left:6px solid ${SEATC[i]}" ${i < S.locals ? '' : 'hidden'}>`).join('')}</div>
    <div class="pick three" id="pX">${b(S.hints, 'data-x="hints"', `💡 ${L('Hints', 'Pistas')}<small>${L('what a swap does', 'qué hace un cambio')}</small>`)}${b(S.badges, 'data-x="badges"', `🔢 ${L('Card points', 'Puntos en cartas')}<small>${L('A=1 · 2=−2 · K=0', 'A=1 · 2=−2 · K=0')}</small>`)}${b(S.jokers, 'data-x="jokers"', `★ ${L('Jokers', 'Comodines')}<small>${L('2 jokers, −2 each', '2 comodines, −2 cada uno')}</small>`)}</div>
    <p class="gf-rec" id="pPh">${phoneLine()}</p>
    ${S.played ? `<p class="gf-rec">🏆 ${L(`Matches won: ${S.wins} of ${S.played}`, `Partidas ganadas: ${S.wins} de ${S.played}`)}${S.bestHole != null ? ` · ${L('best hole', 'mejor hoyo')} ${fmt(S.bestHole)}` : ''}</p>` : ''}</div>`;
  const d = E.titleScreen({ party: PARTY(), title: L('Six-Card Golf', 'Golf de seis cartas'), kicker: L('Inoa Games · Card Room', 'Inoa Games · Sala de juegos'), lead: L('Six cards face down, two turned up. Swap your way to the lowest score: pairs in a column count zero.', 'Seis cartas boca abajo, dos volteadas. Cambia cartas hasta el puntaje más bajo: las parejas en columna valen cero.'),
    how: [['🂠', L('Draw from the stock or take the top discard', 'Roba del mazo o toma el descarte de arriba')], ['🔁', L('Swap it for one of your cards, or discard it and turn a card up', 'Cámbiala por una de tus cartas, o descártala y voltea una')], ['⛳', L('A=1, 2=−2, K=0, J/Q=10. A pair in a column = 0. Lowest wins', 'A=1, 2=−2, K=0, J/Q=10. Pareja en columna = 0. Gana el más bajo')]], extra, onPlay: () => { titleEl = null; save(); start(); } });
  titleEl = d;
  const sel = (q, el) => d.querySelectorAll(q).forEach(x => { const on = x === el; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
  d.querySelectorAll('#pL button').forEach(x => x.onclick = () => { SFX.click(); E.setSetting('lang', x.dataset.l); });
  d.querySelectorAll('#pN button').forEach(x => x.onclick = () => { S.players = +x.dataset.n; if (S.locals > S.players) S.locals = S.players; SFX.click(); save(); renderTitle(); });
  d.querySelectorAll('#pG button').forEach(x => x.onclick = () => { S.holes = +x.dataset.g; sel('#pG button', x); SFX.click(); save(); });
  d.querySelectorAll('#pS button').forEach(x => x.onclick = () => { S.skill = x.dataset.s; sel('#pS button', x); SFX.click(); save(); });
  d.querySelectorAll('#pH button').forEach(x => x.onclick = () => { S.locals = +x.dataset.h; sel('#pH button', x); $('pNames').hidden = S.locals < 2; d.querySelectorAll('#pNames input').forEach(inp => inp.hidden = +inp.dataset.i >= S.locals); SFX.click(); save(); });
  d.querySelectorAll('#pNames input').forEach(inp => { inp.addEventListener('input', () => { S.names[+inp.dataset.i] = inp.value.replace(/[<>]/g, '').trim() || `P${+inp.dataset.i + 1}`; save(); }); inp.addEventListener('keydown', e => e.stopPropagation()); });
  d.querySelectorAll('#pX button').forEach(x => x.onclick = () => { const k = x.dataset.x; S[k] = !S[k]; x.classList.toggle('on', S[k]); x.setAttribute('aria-pressed', S[k]); SFX.click(); save(); if (k === 'badges') demoTable(); });
}
E.net.on('change', () => { if (titleEl && titleEl.isConnected && !document.querySelector('.inoa-pp')) renderTitle(); else if (titleEl && titleEl.isConnected) { const el = document.getElementById('pPh'); if (el) el.textContent = phoneLine(); } });
function phoneLine() {
  const n = E.net.role === 'host' ? E.net.pads('pad').length : 0, o = room ? room.players.length : 0;
  return [n ? L(`📱 ${n} phone${n > 1 ? 's' : ''} connected: each one is a player`, `📱 ${n} teléfono${n > 1 ? 's' : ''}: cada uno es un jugador`) : '', o ? L(`🌐 ${o} online player${o > 1 ? 's' : ''} ready: they play on their own screen`, `🌐 ${o} jugador${o > 1 ? 'es' : ''} en línea: juega${o > 1 ? 'n' : ''} en su pantalla`) : ''].filter(Boolean).join(' · ');
}
addEventListener('inoa:settings', e => { if (!e.detail || e.detail.key !== 'lang') return; document.title = L('Six-Card Golf', 'Golf de seis cartas'); if (titleEl && titleEl.isConnected) renderTitle(); else if (G) { renderAll(); if (document.querySelector('.gf-card .gf-rows')) holeCard(); } });
// the title table: a grid of six cards with a pair of kings and a 2 turned up
function demoTable() {
  for (const m of meshes.values()) scene.remove(m); meshes.clear(); for (const k in TEX) { if (k !== 'back') { TEX[k].map.dispose(); TEX[k].dispose(); delete TEX[k]; } }
  const demo = [{ r: 13, s: 'H', id: 'd1' }, null, { r: 2, s: 'C', id: 'd3' }, { r: 13, s: 'S', id: 'd4' }, { r: 7, s: 'D', id: 'd5' }, null];
  demo.forEach((c, i) => { const ms = makeCard(c || { r: 5, s: 'S', id: 'dx' + i }); const p = slotPos({ x: 0, z: -1.2 }, i); ms.position.set(p.x, CARD_Y, p.z); ms.rotation.z = c ? 0 : Math.PI; scene.add(ms); meshes.set('demo' + i, ms); });
  const top = makeCard({ r: 1, s: 'H', id: 'dt' }); top.position.set(1.05, CARD_Y, 3.6); top.rotation.y = .12; scene.add(top); meshes.set('demoTop', top);
  stockG.visible = true; stockBody.scale.y = .4; stockBody.position.y = FELT_Y + .2; stockTop.position.y = FELT_Y + .403; stockG.position.set(-1.05, 0, 3.6);
}

/* ======================= boot ======================= */
document.title = L('Six-Card Golf', 'Golf de seis cartas');
ld.set(1); if (JOIN) guest.join(); else title_();
if (!JOIN && new URLSearchParams(location.search).get('online')) setTimeout(() => E.NET.partyPanel(PARTY()), 300);
ld.done(); window.__READY = true;
E.loop(dt => { update(dt); R.render(dt); });
window.__GAME = {
  get G() { return G; }, get m() { return G && G.m; }, get state() { return G && G.m.state; }, get phase() { return G ? G.m.phase : 'title'; }, get resultsCount() { return resultsCount; }, S, GR, CR, CARDS, R, THREE,
  start, update, title: title_, rawAct: mv => guest && guest.act('act', { move: mv }), tapCard, tapPile, discardIt, cancelFlip, holeCard, finishMatch, next: () => { const b = document.querySelector('.gf-card [data-a=next]'); if (b) b.click(); },
  cardMesh: id => meshes.get(id), legal: s => G.m.legal(s), act: (s, mv, from = 'local') => G.m.act(s, mv, from), view: s => G.m.view(s), auto(v) { if (G) G.auto = !!v; },
  fast(v = true) { window.__GF_FAST = !!v; },
  // run the simulation n steps of dt (tests): bots + auto-locals keep playing; hole cards are clicked through when skipCards is set
  run(n = 600, dt = 1 / 30, { skipCards = false } = {}) { for (let i = 0; i < n; i++) { update(dt); if (skipCards && document.querySelector('.gf-card [data-a=next]') && G && G.m.phase === 'roundEnd') window.__GAME.next(); if (!G || G.done || (G.m.phase === 'matchEnd' && document.querySelector('.gf-card'))) break; } return G && G.m.phase; }
};
