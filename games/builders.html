function nearestNode(maxD = 1.5) { let best = null, bd = 1e9; const fx = Math.sin(player.yaw), fz = Math.cos(player.yaw); for (const n of NODES) { if (!n.alive) continue; const dx = n.x - player.pos.x, dz = n.z - player.pos.z; const d = Math.hypot(dx, dz) - n.r; if (d > maxD) continue; const facing = (dx * fx + dz * fz) / (Math.hypot(dx, dz) || 1); const score = d - facing * .6; if (score < bd) { bd = score; best = n; } } return best; }

  else if (n.tool === 'shovel') { E.tone(1300, .05, 'square', .05); E.noise(.1, .14, 3200, 2); P.burst(top, { color: 0xd8d2c4, n: 10, speed: 1.6, up: 2, size: .14, life: .5, additive: false, gravity: 9 }); P.burst(top, { color: 0xffe9a8, n: 4, speed: 2, up: 2, size: .1, life: .3 }); }
  else { E.noise(.18, .06, 2400, .8); SFX.pop(); P.burst(top, { color: n.res === 'food' ? 0xff6b6b : 0x7cbf5a, n: 8, speed: 1, up: 1.8, size: .16, life: .6, additive: false, gravity: 6 }); if (n.g.userData.fruit) { const f = n.g.userData.fruit.filter(f => f.visible); const per = Math.ceil(f.length / Math.max(1, n.hp + 1)); for (let k = 0; k < per && f[k]; k++) f[k].visible = false; } }
  const sp = E.toScreen(top.add(V3(0, .6, 0)), camera); E.floatText(`+${amt} ${RES[gain]}`, sp.x, sp.y, 'gold');

  hud(); checkQuest(); }
function interact() {

  const plot = nearPiece(['plot'], 1.9); if (plot) { plotAction(plot); return; }
  const boat = nearPiece(['boat'], 2.6); if (boat) { board(boat); return; }
  const bed = nearPiece(['bed'], 2.2); if (bed) { trySleep(); return; }
  const ch = nearPiece(['chest'], 1.8); if (ch) { toast(`${tr('Your chest', 'Tu cofre')}: ${Object.entries(S.inv).map(([k, v]) => `${RES[k]} ${v}`).join('  ')}`, 2200); SFX.pop(); return; }
  const fire = nearPiece(['campfire'], 2.2); if (fire) { toast(tr('Toasty! 🔥 The fire keeps the night cozy.', '¡Calentito! 🔥 El fuego hace la noche acogedora.'), 1600); P.burst(fire.g.position.clone().add(V3(0, .8, 0)), { color: 0xffb347, n: 12, speed: .6, up: 2.5, size: .15, life: .9, gravity: -1 }); return; }
  toast(tr('Walk up to a tree 🌴, rock 🪨 or bush 🌿 and press ✋', 'Acércate a un árbol 🌴, roca 🪨 o arbusto 🌿 y pulsa ✋'), 1800);
}

/* ================= boat ================= */

/* ================= sleep / days ================= */

}

/* ================= quests ================= */

/* ================= build mode ================= */

/* ================= flow ================= */
function pause() { if (G.modal) return; G.modal = true; music && music.stop(); E.pauseMenu({ onResume: () => { G.modal = false; music = E.music(E.SONGS.chill); }, onRestart: () => askReset(), extra: `<div class="ig-row"><button class="ig-chipbtn" data-a="photo">📷 Photo mode</button><button class="ig-chipbtn" data-a="share">🔗 Share island</button></div><p class="ig-sub" style="font-size:13px">Restart starts a brand-new island (your current one is replaced).</p>` }); const card = [...document.querySelectorAll('.ig-screen')].pop(); card.querySelector('[data-a=photo]').onclick = () => { card.remove(); G.modal = false; music = E.music(E.SONGS.chill); photo(true); }; card.querySelector('[data-a=share]').onclick = () => { card.remove(); G.modal = false; music = E.music(E.SONGS.chill); openShare(); }; }
function askReset() { const d = document.createElement('div'); d.className = 'db-sheet'; d.innerHTML = `<div class="ig-card"><div class="ig-kicker">New island?</div><h2>Start a brand-new island?</h2><p class="ig-sub">Your current island and everything on it will be replaced. Tip: share it first with 🔗 to keep a copy.</p><div class="ig-row"><button class="ig-btn ghost" data-a="no">Keep my island</button><button class="ig-btn coral" data-a="yes">New island</button></div></div>`; document.body.appendChild(d); G.modal = true; d.querySelector('[data-a=no]').onclick = () => { d.remove(); G.modal = false; music = E.music(E.SONGS.chill); }; d.querySelector('[data-a=yes]').onclick = () => { d.remove(); confirmReset(); }; }
function confirmReset() { const keepPlayer = S.player; S = Object.assign(DEF(), { player: keepPlayer }); E.store.set(KEY, S); G.visit = false; loadIsland(S.seed, []); G.undo = []; G.modal = false; music = E.music(E.SONGS.chill); hud(); drawQuest(); toast(tr('A fresh island washes up! 🏝️', '¡Llega una isla nueva! 🏝️'), 2000, true); return true; }
function start() {
  input.poll(); G.mode = 'play'; buildPlayer(); const sp = S.pos ? V3(S.pos[0], 0, S.pos[1]) : spawnPoint(); player.pos.copy(sp); player.yaw = S.pos ? S.pos[2] : Math.PI; player.y = groundAt(sp.x, sp.z); cam.yaw = player.yaw + Math.PI; updateCamera(0, true);
  if (!SH) { SH = E.shell({ onPause: pause, stick: true, buttons: [{ id: 'bAlt', icon: '🏃', label: 'Run / rotate' }, { id: 'bBuild', icon: '🔨', label: 'Build mode' }, { id: 'bAct', icon: '✋', label: 'Gather / place', cls: 'big' }] }); bindPad();
    questEl = document.createElement('div'); questEl.className = 'db-quest'; document.body.appendChild(questEl);
    dayEl = document.createElement('div'); dayEl.className = 'db-day'; dayEl.innerHTML = `<span class="ig-chip" id="dbClock"></span><button class="ig-chip" id="dbPhoto" aria-label="Photo mode">📷</button><button class="ig-chip" id="dbShare" aria-label="Share island">🔗</button>`; document.body.appendChild(dayEl); $('dbPhoto').onclick = () => photo(true); $('dbShare').onclick = openShare; }
  hud(); drawQuest(); updateButtons(); music && music.stop(); music = E.music(E.SONGS.chill);
  E.say(S.built ? tr('Welcome back to your island!', '¡Bienvenido de nuevo a tu isla!') : tr('Welcome to Driftwood Builders! Walk with the stick or W A S D. Press the hand button near trees, rocks and bushes to gather.', '¡Bienvenido a Driftwood Builders! Camina con la palanca o W A S D. Pulsa el botón de la mano cerca de árboles, rocas y arbustos para recolectar.'));
}
function title() { G.mode = 'title';
  const extra = `<div><p class="ig-sub" style="margin-bottom:6px">${tr('Your builder', 'Tu constructor')}</p><div class="ig-row" id="dbP">${PLAYERS.map((p, i) => `<button class="ig-chipbtn ${i === S.player ? 'on' : ''}" data-i="${i}">${p[1]}</button>`).join('')}</div></div>`;
  const d = E.titleScreen({ title: 'Driftwood Builders', kicker: tr('Inoa Games · Island sandbox', 'Inoa Games · Isla para construir'), lead: tr('Wash up on a tiny island, gather driftwood, stone and fibre, and build a cozy home by the sea. Nights are safe — just a little darker, with lanterns glowing.', 'Llegas a una islita: junta madera, piedra y fibra, y construye una casa acogedora junto al mar. Las noches son seguras — solo un poco más oscuras, con faroles encendidos.'), how: [['🕹️', tr('Move: stick, WASD or arrows · drag to look · tap to walk', 'Mover: palanca, WASD o flechas · arrastra para mirar · toca para caminar')], ['✋', tr('Gather: Space/✋ next to trees, rocks, bushes and fruit', 'Recolectar: Espacio/✋ junto a árboles, rocas, arbustos y fruta')], ['🔨', tr('Build: E/🔨, pick a piece (Q/C, LB/RB), R/↻ rotates, ✅ places (green = fits)', 'Construir: E/🔨, elige pieza (Q/C, LB/RB), R/↻ gira, ✅ coloca (verde = cabe)')], ['🎮', tr('Gamepad: A gather/place · B run/rotate · X build · LB/RB pieces · LT undo · Back remove', 'Mando: A recolectar/colocar · B correr/girar · X construir · LB/RB piezas · LT deshacer · Back quitar')], ['📜', tr('Follow the quests · 🔗 share your island · 📷 photo mode', 'Sigue las misiones · 🔗 comparte tu isla · 📷 modo foto')]], extra, onPlay: start });
  d.querySelectorAll('#dbP button').forEach(b => b.onclick = () => { S.player = +b.dataset.i; d.querySelectorAll('#dbP button').forEach(x => x.classList.toggle('on', x === b)); E.store.set(KEY, S); }); }
document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play') { save(); if (!G.modal) pause(); } });

/* ================= boot ================= */
loadIsland(S.seed, S.pieces); PLIST.forEach(p => syncCrop(p)); applyTime(); buildPlayer(); player.pos.copy(spawnPoint()); player.root.position.copy(player.pos).setY(H(player.pos.x, player.pos.z));
// warm-up: compile every material variant once behind the loading screen
{ const tmp = []; for (const t of PKEYS) { const g = buildPiece({ t, i: 0, j: 0, r: 0 }); g.position.set(0, 3, 0); world.add(g); tmp.push(g); const gh = buildPiece({ t, i: 0, j: 0, r: 0 }); gh.traverse(o => { if (o.isMesh) o.material = MT.ghostOK; }); world.add(gh); tmp.push(gh); } for (const c of CROPS) { const m = E.instance(c, { scale: .4 }); world.add(m); tmp.push(m); } for (const k in tools) tools[k].visible = true; SKY.starMat.opacity = .5; ffMat.opacity = .5; P.burst(V3(0, 1, 0), { n: 2 }); P.burst(V3(0, 1, 0), { n: 2, additive: false }); POOL.forEach(l => l.intensity = 1); playerLight.intensity = 1;
  camera.position.set(0, 8, 14); camera.lookAt(0, 2, 0); R.render(1 / 60); tmp.forEach(o => world.remove(o)); for (const k in tools) tools[k].visible = false; applyTime(); }
title(); ld.done(); window.__READY = true;
E.loop((dt) => { if (window.__NORENDER) return; update(dt); updateCamera(dt); R.render(dt); });
window.__GAME = {
  get G() { return G; }, get S() { return S; }, update, start, player, cam, NODES, PLIST, R, H, tools, toggleBuild, placeNow, rotate, undo, photo, exportCode, visitCode, goHome, shelterCount, interact, trySleep, endOfDay,
  give(r) { for (const k in r) S.inv[k] += r[k]; hud(); },
  ff(sec) { S.dayT += sec / DAY_LEN; S.clock = (S.clock || 0) + sec; while (S.dayT >= 1) { S.dayT -= 1; endOfDay(); } applyTime(); },
  setDayT(t) { S.dayT = t; applyTime(); },
  // teleport next to the nearest live node of a type and gather it completely
  autoGather(type) { let best = null, bd = 1e9; for (const n of NODES) if (n.alive && (n.type === type || n.res === type)) { const d = Math.hypot(n.x - player.pos.x, n.z - player.pos.z); if (d < bd) { bd = d; best = n; } } if (!best) return 0; const a = Math.atan2(player.pos.z - best.z, player.pos.x - best.x); player.pos.set(best.x + Math.cos(a) * (best.r + .7), 0, best.z + Math.sin(a) * (best.r + .7)); player.y = groundAt(player.pos.x, player.pos.z); player.yaw = Math.atan2(best.x - player.pos.x, best.z - player.pos.z); let n = 0; while (best.alive && n < 10) { hitNode(best); n++; } return n; },
  build(t, i, j, r = 0) { G.sel = t; const p = { t, i, j, r: t === 'boat' ? boatR(i, j) : r }; const err = validate(p) || (canPay(PIECES[t].cost) ? null : 'cost'); if (err) return err; pay(PIECES[t].cost); const np = addPiece(p); S.built++; G.day.built++; refreshAround(np); checkQuest(); hud(); return 'ok'; },
  findFlat(minSize = 3) { const sp = player.pos; for (let r = 0; r < 14; r++) for (let a = -r; a <= r; a++) for (let b = -r; b <= r; b++) { if (Math.max(Math.abs(a), Math.abs(b)) !== r) continue; const [ci, cj] = cellOf(sp.x, sp.z); const i = ci + a, j = cj + b; let ok = true; for (let x = 0; x < minSize && ok; x++) for (let y = 0; y < minSize && ok; y++) { const st = cellStats(i + x, j + y); if (st.mn < .3 || st.mx - st.mn > .9 || nodeInCell(i + x, j + y) || OCC.get(`g:${i + x}:${j + y}`)) ok = false; } if (ok) return [i, j]; } return null; },
  findShore() { const sp = player.pos; let best = null, bd = 1e9; for (let i = -24; i < 24; i++) for (let j = -24; j < 24; j++) { const p = { t: 'dock', i, j, r: 0 }; if (validate(p)) continue; const c = cellC(i, j); const d = c.distanceTo(sp); if (d < bd) { bd = d; best = [i, j]; } } return best; },
  findBoatSpot() { for (const p of PLIST.filter(p => p.t === 'dock')) for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { if (!validate({ t: 'boat', i: p.i + a, j: p.j + b, r: 0 })) return [p.i + a, p.j + b]; } return null; },
  teleport(x, z, yaw) { player.pos.set(x, 0, z); player.y = groundAt(x, z); if (yaw != null) player.yaw = yaw; },
  cellC, cellOf, validate, frame() { updateCamera(0, true); }, cyclePiece, boatR,
  faded() { return [...FADING].filter(o => (o.userData.fadeK ?? 1) < .9).length; },
  rects() { const r = el => { if (!el || !el.isConnected || !el.getClientRects().length) return null; const b = el.getBoundingClientRect(); return [Math.round(b.left), Math.round(b.top), Math.round(b.right), Math.round(b.bottom)]; }; const t = document.querySelector('.ig-toast.show'); return { toast: r(t), quest: r(questEl), day: r(dayEl), visit: r(visitEl), pal: r(palEl), tip: tipEl && !tipEl.hidden ? r(tipEl) : null }; }
};
</script>
