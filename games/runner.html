<style>
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}

.pick button.on{border-color:var(--mint-ink);background:var(--mint)}
.pick small{display:block;font-weight:600;color:#4c5868;font-size:11px}
.rn-lbl{margin-bottom:6px}
.rn-pw{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:19;display:flex;gap:8px;pointer-events:none}

.rn-ghost{position:fixed;left:12px;top:64px;z-index:19;font-family:var(--f-d);font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none}
.rn-ghost small{display:block;font-family:var(--f-b);font-weight:800;font-size:11px;opacity:.85;letter-spacing:.06em}
.rn-hint{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:21;background:rgba(27,36,48,.86);color:#fff;font-family:var(--f-d);font-weight:900;font-size:clamp(20px,5vw,30px);padding:12px 20px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.rn-hint.show{opacity:1}
.rn-hearts{color:#e2443a;letter-spacing:1px}
.ig-screen{justify-content:safe center;align-items:safe center}
.pick button{min-height:42px}
.rn-opts{display:grid;gap:10px;align-content:start}
#pR{grid-template-columns:repeat(auto-fill,minmax(66px,1fr))}#pR button{padding:6px 4px}
.ig-title .ig-how{align-content:start}.ig-title .ig-how div{padding:6px 10px;font-size:13px}

<script type="module">
import * as E from '../engine/inoa3d.js';
const { THREE, clamp, lerp, rnd, pick, hash, damp, SFX, $ } = E;

/* ---------- constants ---------- */
const LANE = 2.3, BW = 9.2, CH = 36, NCH = 9, SHORE_X = -19, WATER_Y = -1.05;
const RUNNERS = [
  { model: 'skater-female', name: 'Isla' }, { model: 'skater-male', name: 'Rafa' }, { model: 'survivor-female', name: 'Yara' },
  { model: 'survivor-male', name: 'Mateo' }, { model: 'cyborg-female', name: 'Nova' }, { model: 'male', name: 'Dante' }
];
const POWERS = { magnet: { e: '🧲', name: 'Coin magnet', t: 9, col: 0xff6b6b }, double: { e: '✖️2', name: 'Double coins', t: 10, col: 0xffd166 }, shield: { e: '🛡️', name: 'Bubble shield', t: 14, col: 0x5bd2ff } };
const localDate = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const strSeed = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
function mulberry(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const laneX = i => (i - 1) * LANE;

/* ---------- character-space posing (rig-independent; engine POSES bend knees backwards on these rigs) ---------- */
// p = {Bone: [x, y, z]} radians about the CHARACTER's axes (x: +swing back for down-pointing limbs / +bend forward for spine & head, z: raise/lower arms sideways; Left −, Right +).
const ORDER = ['Hips', 'Spine', 'Chest', 'UpperChest', 'Neck', 'Head', 'LeftShoulder', 'LeftArm', 'LeftForeArm', 'LeftHand', 'RightShoulder', 'RightArm', 'RightForeArm', 'RightHand', 'LeftUpLeg', 'LeftLeg', 'LeftFoot', 'RightUpLeg', 'RightLeg', 'RightFoot'];
const AXES = [new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 1)], _pq = new THREE.Quaternion(), _cq = new THREE.Quaternion(), _rq = new THREE.Quaternion(), _ax = new THREE.Vector3();
function cpose(rig, model, p) {
  if (!rig) return;
  if (!rig.__plan) { const names = new Set(ORDER.filter(n => rig[n])); Object.defineProperty(rig, '__plan', { value: ORDER.filter(n => rig[n]).map(n => ({ n, b: rig[n], par: names.has(rig[n].parent.name) && rig[rig[n].parent.name] === rig[n].parent ? rig[n].parent.name : null })), enumerable: false }); Object.defineProperty(rig, '__w', { value: {}, enumerable: false }); }

  for (const e of rig.__plan) { const b = e.b, v = p[e.n]; const pw = e.par ? W[e.par] : (W['^' + e.n] || (W['^' + e.n] = new THREE.Quaternion())); if (!e.par) b.parent.getWorldQuaternion(pw);
    if (v) for (const i of [2, 0, 1]) { if (!v[i]) continue; _ax.copy(AXES[i]).applyQuaternion(_cq); _rq.setFromAxisAngle(_ax, v[i]); _pq.copy(pw).invert(); b.quaternion.premultiply(pw).premultiply(_rq).premultiply(_pq); }
    (W[e.n] || (W[e.n] = new THREE.Quaternion())).multiplyQuaternions(pw, b.quaternion); }
}
const PZ = {
  idle: t => ({ LeftArm: [Math.sin(t * 2) * .03, 0, -1.3], RightArm: [Math.sin(t * 2) * .03, 0, 1.3], LeftForeArm: [-.2], RightForeArm: [-.2], Spine: [Math.sin(t * 2) * .02], Head: [0, Math.sin(t * .7) * .25, 0] }),
  run: (t, s = 1) => { const ph = t * 11 * s, w = Math.sin(ph), c = Math.cos(ph); return { LeftUpLeg: [-w * .8], RightUpLeg: [w * .8], LeftLeg: [.25 + Math.max(0, c) * 1.25], RightLeg: [.25 + Math.max(0, -c) * 1.25], LeftArm: [w * .85, 0, -1.25], RightArm: [-w * .85, 0, 1.25], LeftForeArm: [-1.25], RightForeArm: [-1.25], Spine: [.22], Head: [-.12] }; },
  jump: () => ({ LeftUpLeg: [-1.05], LeftLeg: [1.5], RightUpLeg: [-.15], RightLeg: [.7], LeftArm: [-.6, 0, -.45], RightArm: [.4, 0, .6], LeftForeArm: [-.6], RightForeArm: [-.5], Spine: [.1] }),
  slide: () => ({ Spine: [.45], Head: [.35], LeftUpLeg: [-.1], LeftLeg: [.1], RightUpLeg: [-.55], RightLeg: [1.5], LeftArm: [.7, 0, -1.05], RightArm: [.7, 0, 1.05], LeftForeArm: [-.3], RightForeArm: [-.3] }),
  stumble: t => ({ ...PZ.run(t, .55), Spine: [.75], Head: [.25], LeftArm: [-.9, 0, -.3 + Math.sin(t * 28) * .4], RightArm: [-.9, 0, .3 - Math.sin(t * 28) * .4], LeftForeArm: [-.4], RightForeArm: [-.4] }),
  fall: () => ({ LeftArm: [-2.7, 0, -1.25], RightArm: [-2.7, 0, 1.25], LeftForeArm: [-.2], RightForeArm: [-.2], LeftUpLeg: [.15], RightUpLeg: [-.1], LeftLeg: [.5], RightLeg: [.2], Head: [-.6] })
};

/* ---------- engine ---------- */
const ld = E.loading('Tide Runner', 'Waxing the boardwalk…');
const R = E.createRenderer($('gl'), { fov: 58, portraitFov: 72, far: 520, shadowSize: 24 });
const { scene, camera, sun } = R;
await E.loadPack('../packs/runner.json', R, p => ld.set(p));
const LOOK = { skyTop: 0x4f86d4, skyHor: 0xffd2a6, skyGlow: 0xffb070, sunDir: [-.36, .09, -.93], fog: 0xf6d6b8, fogNear: 70, fogFar: 260, sun: 2.3, sunColor: 0xffd2a0, hemi: .75, ground: 0xa58a6a, exposure: 1.0, env: .22, bloom: .16, bloomThreshold: .92, clouds: true };
R.setLook(LOOK); const sky = scene.children[scene.children.length - 1]; R.setEnv(E.ASSETS.hdri.sunset);
const SUN_DIR = new THREE.Vector3(-.42, .8, -.45).normalize();
const sunDisc = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const r = g.createRadialGradient(128, 128, 0, 128, 128, 128); r.addColorStop(0, 'rgba(255,250,230,1)'); r.addColorStop(.16, 'rgba(255,236,190,1)'); r.addColorStop(.22, 'rgba(255,200,140,.55)'); r.addColorStop(1, 'rgba(255,170,110,0)'); g.fillStyle = r; g.fillRect(0, 0, 256, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, fog: false, toneMapped: false, blending: THREE.AdditiveBlending })); s.scale.set(90, 90, 1); s.renderOrder = -9; scene.add(s); return s; })();
const SKY_SUN = new THREE.Vector3(...LOOK.sunDir).normalize();
const input = E.createInput({ surface: $('gl') });
const PT = new E.Particles(scene);
const S = Object.assign({ runner: 0, mode: 'endless', diff: 'friendly', best: { endless: 0, daily: { date: '', d: 0 } }, ghost: { endless: null, daily: null } }, E.store.get('inoa.runner', {}));
const save = () => E.store.set('inoa.runner', S);
let G = null, music = null;

/* ---------- shared materials / textures ---------- */
const woodTop = E.pbr('wood', 0xe0bb86, [CH / 1.2, 1], { bump: 3 });
const woodDark = E.pbr('wood', 0x8a6040, [1, 6]);
const sandMat = E.pbr('sand', 0xf3dcb0, [6, 12]);
const sandWet = E.pbr('sand', 0xeed3a2, [6, 12]);
const grassMat = E.pbr('grass', 0x7aa05a, [10, 10], { bump: 2 });
const metalMat = E.pbr('metal', 0x3a3f48, [1, 2]);
function stripeTex(a, b, n = 8, vertical = false) { const c = document.createElement('canvas'); c.width = 256; c.height = 64; const g = c.getContext('2d'); for (let i = 0; i < n; i++) { g.fillStyle = i % 2 ? b : a; if (vertical) g.fillRect(0, i * 64 / n, 256, 64 / n); else g.fillRect(i * 256 / n, 0, 256 / n, 64); } const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
function glintTex() { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,240,190,.6)'); r.addColorStop(1, 'rgba(255,220,150,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); g.fillStyle = 'rgba(255,255,255,.95)'; g.beginPath(); g.moveTo(32, 0); g.lineTo(35, 29); g.lineTo(64, 32); g.lineTo(35, 35); g.lineTo(32, 64); g.lineTo(29, 35); g.lineTo(0, 32); g.lineTo(29, 29); g.closePath(); g.fill(); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
function emojiTex(e, bg) { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); g.fillStyle = bg; g.beginPath(); g.arc(64, 64, 58, 0, 6.3); g.fill(); g.lineWidth = 6; g.strokeStyle = '#fff'; g.stroke(); g.font = '64px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(e, 64, 70); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
const GLINT = glintTex();

/* ---------- water (wave shader, world-space so it can follow the runner) ---------- */
const waterMat = new THREE.ShaderMaterial({ transparent: true, fog: true, uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uTime: { value: 0 }, uC: { value: new THREE.Color(0x3aa7b8) }, uD: { value: new THREE.Color(0x1d5f7a) }, uSky: { value: new THREE.Color(0xffc9a0) }, uSun: { value: new THREE.Color(0xffd9a8) }, uSunDir: { value: new THREE.Vector3(...LOOK.sunDir).normalize() }, uShore: { value: SHORE_X } }]),
  vertexShader: `uniform float uTime;varying vec3 vW;varying vec3 vN;
#include <fog_pars_vertex>
void main(){vec4 w=modelMatrix*vec4(position,1.);float a=w.x*.15+uTime*1.1,b=w.z*.21-uTime*1.4,c=(w.x+w.z)*.37+uTime*2.;
w.y+=sin(a)*.16+sin(b)*.12+sin(c)*.05;float dx=cos(a)*.15*.16+cos(c)*.37*.05,dz=cos(b)*.21*.12+cos(c)*.37*.05;
vN=normalize(vec3(-dx*3.,1.,-dz*3.));vW=w.xyz;vec4 mvPosition=viewMatrix*w;gl_Position=projectionMatrix*mvPosition;
#include <fog_vertex>
}`,
  fragmentShader: `uniform vec3 uC,uD,uSky,uSun,uSunDir;uniform float uTime,uShore;varying vec3 vW;varying vec3 vN;
#include <fog_pars_fragment>
void main(){vec3 V=normalize(cameraPosition-vW);vec3 N=normalize(vN+vec3(sin(vW.x*2.1+uTime*3.)*.05,0.,cos(vW.z*2.6-uTime*2.4)*.05));
float fres=pow(1.-max(dot(N,V),0.),3.);vec3 c=mix(uD,uC,.55+.45*sin(vW.x*.05+vW.z*.03));c=mix(c,uSky,fres*.55);
float sp=pow(max(dot(reflect(-V,N),normalize(uSunDir)),0.),90.);c+=uSun*sp*1.4;
float sh=smoothstep(2.2,0.,abs(vW.x-uShore+sin(vW.z*.25+uTime*.8)*.7));c=mix(c,vec3(.97,.95,.9),sh*.6);
gl_FragColor=vec4(c,.94);
#include <tonemapping_fragment>
#include <colorspace_fragment>
#include <fog_fragment>
}` });
const sea = new THREE.Mesh(new THREE.PlaneGeometry(520, 520, 90, 90), waterMat); sea.rotation.x = -Math.PI / 2; sea.position.set(SHORE_X - 260 + 4, WATER_Y, 0); scene.add(sea);

/* ---------- world chunks (recycled) ---------- */
const lanternProto = (() => { const g = new THREE.Group(); const post = new THREE.Mesh(new THREE.CylinderGeometry(.09, .12, 2.6, 8), woodDark); post.position.y = 1.3; g.add(post); const arm = new THREE.Mesh(new THREE.BoxGeometry(.08, .08, .7), woodDark); arm.position.set(0, 2.5, .3); arm.rotation.x = 0; g.add(arm); const lant = new THREE.Group(); const cage = new THREE.Mesh(new THREE.BoxGeometry(.3, .4, .3), new THREE.MeshStandardMaterial({ color: 0xffd9a0, emissive: 0xffa040, emissiveIntensity: 1.3, roughness: .4 })); lant.add(cage); const cap = new THREE.Mesh(new THREE.ConeGeometry(.26, .2, 4), metalMat); cap.position.y = .3; cap.rotation.y = Math.PI / 4; lant.add(cap); lant.position.set(0, 2.2, .6); g.add(lant); g.traverse(o => { if (o.isMesh) o.castShadow = true; }); return g; })();
function umbrella(col) { const g = new THREE.Group(); const pole = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, 2.3, 6), E.mat(0xf2efe8)); pole.position.y = 1.15; g.add(pole); const top = new THREE.Mesh(new THREE.ConeGeometry(1.5, .55, 12, 1, true), new THREE.MeshStandardMaterial({ map: stripeTex('#fff8ee', col, 12), side: THREE.DoubleSide, roughness: .8 })); top.position.y = 2.25; g.add(top); const towel = new THREE.Mesh(new THREE.BoxGeometry(.9, .03, 1.8), new THREE.MeshStandardMaterial({ map: stripeTex(col, '#fff8ee', 6, true), roughness: .95 })); towel.position.set(.9, .02, .3); towel.rotation.y = .3; g.add(towel); g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return g; }
const UMB_COLS = ['#ff7b6b', '#ffd166', '#5bc8b5', '#8c6cff', '#5bb8ff'];
const PALMS = ['palm-long', 'palm-detailed-short'], HOUSES = ['house-4', 'house-5', 'house-6', 'house-7', 'house1'];
function sandGeo() { const g = new THREE.PlaneGeometry(44, CH, 22, 1); g.rotateX(-Math.PI / 2); const p = g.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i) - 22 - BW / 2; p.setX(i, x); p.setY(i, -.45 - E.smooth(-6.5, -30, x) * 1.3); p.setZ(i, p.getZ(i) - CH / 2); } g.computeVertexNormals(); return g; }
const SAND_GEO = sandGeo();
const TOP_GEO = (() => { const g = new THREE.PlaneGeometry(CH, BW); g.rotateX(-Math.PI / 2); g.rotateY(Math.PI / 2); g.translate(0, 0, -CH / 2); return g; })();
const chunks = [];
function makeChunk() {
  const g = new THREE.Group(); scene.add(g);
  const top = new THREE.Mesh(TOP_GEO, woodTop); top.receiveShadow = true; g.add(top);
  for (const s of [-1, 1]) { const beam = new THREE.Mesh(new THREE.BoxGeometry(.32, .55, CH), woodDark); beam.position.set(s * (BW / 2 + .1), -.25, -CH / 2); beam.castShadow = beam.receiveShadow = true; g.add(beam); }
  const pil = new THREE.InstancedMesh(new THREE.CylinderGeometry(.16, .18, 1.6, 8), woodDark, 24); const o = new THREE.Object3D(); let n = 0; for (const s of [-1, 1]) for (let i = 0; i < 12; i++) { o.position.set(s * (BW / 2 + .15), -.7, -i * 3 - 1.5); o.updateMatrix(); pil.setMatrixAt(n++, o.matrix); } pil.castShadow = true; g.add(pil);
  const rp = new THREE.InstancedMesh(new THREE.CylinderGeometry(.07, .08, .9, 6), woodDark, 24); n = 0; for (const s of [-1, 1]) for (let i = 0; i < 12; i++) { o.position.set(s * (BW / 2 + .1), .45, -i * 3 - 1.5); o.updateMatrix(); rp.setMatrixAt(n++, o.matrix); } rp.castShadow = true; g.add(rp);
  for (const s of [-1, 1]) { const rope = new THREE.Mesh(new THREE.CylinderGeometry(.035, .035, CH, 6), E.mat(0xd9c39a)); rope.rotation.x = Math.PI / 2; rope.position.set(s * (BW / 2 + .1), .78, -CH / 2); g.add(rope); }
  const sandL = new THREE.Mesh(SAND_GEO, sandMat); sandL.receiveShadow = true; g.add(sandL);
  const sandR = new THREE.Mesh(new THREE.PlaneGeometry(10, CH), sandWet); sandR.rotation.x = -Math.PI / 2; sandR.position.set(BW / 2 + 5, -.45, -CH / 2); sandR.receiveShadow = true; g.add(sandR);
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(80, CH), grassMat); grass.rotation.x = -Math.PI / 2; grass.position.set(BW / 2 + 10 + 40, -.44, -CH / 2); grass.receiveShadow = true; g.add(grass);
  const lan = []; for (const s of [-1, 1]) for (let k = 0; k < 2; k++) { const l = lanternProto.clone(); l.position.set(s * (BW / 2 + .45), -.05, -k * 18 - 6); l.rotation.y = s > 0 ? -Math.PI / 2 : Math.PI / 2; g.add(l); lan.push(l); }
  const palms = []; for (let k = 0; k < 5; k++) { const p = E.instance(PALMS[k % 2], { scale: 7 + (k % 3) }); g.add(p); palms.push(p); }
  const houses = []; for (let k = 0; k < 2; k++) { const h = E.instance(HOUSES[(chunks.length * 2 + k) % HOUSES.length], { scale: 10 }); h.rotation.y = -Math.PI / 2; g.add(h); houses.push(h); }
  const umb = umbrella(UMB_COLS[chunks.length % UMB_COLS.length]); g.add(umb);
  const boat = E.instance('boat-small', { scale: 4 }); g.add(boat);
  const ship = E.instance('ship-light', { scale: 46, shadow: false }); ship.visible = false; g.add(ship);
  const c = { g, k: -1, palms, houses, umb, boat, ship }; chunks.push(c); return c;
}
function placeChunk(c, k) {
  c.k = k; c.g.position.z = -k * CH; const r = mulberry(k * 7919 + 13);
  c.palms.forEach((p, i) => { const left = i < 3; p.position.set(left ? -7 - r() * 8 : BW / 2 + 2.2 + r() * 4, left ? -.45 - E.smooth(-6.5, -30, -7 - r()) * 1.3 : -.45, -(i * 7 + r() * 5)); p.rotation.y = r() * 6.3; });
  c.houses.forEach((h, i) => { h.position.set(BW / 2 + 15 + r() * 5, -.45, -(i * 18 + 9 + r() * 3)); h.visible = r() < .85; });
  c.umb.position.set(-8.5 - r() * 5, -.45 - E.smooth(-6.5, -30, -10) * 1.3, -r() * CH); c.umb.rotation.y = r() * 6; c.umb.visible = r() < .7;
  c.boat.position.set(-30 - r() * 30, WATER_Y + .1, -r() * CH); c.boat.rotation.y = r() * 6.3; c.boat.visible = r() < .45;
  c.ship.visible = k % 6 === 3; c.ship.position.set(-150 - r() * 40, WATER_Y - 1, -CH / 2); c.ship.rotation.y = r() * 6.3;
}
for (let i = 0; i < NCH; i++) placeChunk(makeChunk(), i);
function streamWorld(d) { const first = Math.floor((d - 14) / CH); for (const c of chunks) if (c.k < first) placeChunk(c, c.k + NCH); }

function takeCoin(c) { c.taken = true; const v = G.mult * (G.pw.double ? 2 : 1); G.coinsN += v; G.coinPitch = Math.min(12, G.coinPitch + 1); G.coinPitchT = .5; E.tone(988 * Math.pow(2, G.coinPitch / 24), .07, 'square', .045); E.tone(1319 * Math.pow(2, G.coinPitch / 24), .12, 'square', .04, 0, .05); PT.burst(new THREE.Vector3(c.x, c.y, -c.d), { color: 0xffd76a, n: 6, speed: 1.6, up: 2, size: .3, life: .45, gravity: 4 }); if (v > 1 && Math.random() < .3) { const sp = E.toScreen(new THREE.Vector3(c.x, c.y + .6, -c.d), camera); E.floatText('+' + v, sp.x, sp.y, 'gold'); } }
function stumble(o) {

}
function knock(o) { if (o.kind === 'jump' && !o.lanes.length === 3 || (o.kind === 'jump' && o.type !== 'log')) o.fly = { t: 0, vx: (o.obj.position.x >= G.x ? 1 : -1) * rnd(3, 5), vy: 6 }; PT.burst(new THREE.Vector3(G.x, .8, -G.d - .6), { color: 0xfff1d0, n: 18, speed: 3, up: 4, size: .5, life: .6, additive: false, gravity: 10 }); }
function overStep(dt) {

function poseRunner(dt, sliding) {

/* ---------- camera ---------- */
function updateCamera(dt) {

/* ---------- flow ---------- */
