function row(c, kind, n, x0, x1, H) { const rows = n > 5 ? 2 : 1, per = Math.ceil(n / rows), cell = Math.min((x1 - x0) / per, H / rows * .95), s = cell * .82; let k = 0; for (let r = 0; r < rows; r++) { const m = Math.min(per, n - k), w = m * cell, sx = (x0 + x1) / 2 - w / 2 + cell / 2, y = H / 2 + (r - (rows - 1) / 2) * cell; for (let i = 0; i < m; i++, k++) shape(c, kind, sx + i * cell, y, s, S.hc); } }

/* ---------------- HUD ---------------- */
function hud() {
  if (!hudEl) return; if (!G) { hudEl.innerHTML = ''; return; }
  if (G.mode === 'party') { hudEl.innerHTML = `<div class="ig-chip">🎉 ${T('Pop party', 'Fiesta de burbujas')}</div>`; return; }
  const n = G.stage.kinds.length; hudEl.innerHTML = `<div class="ig-chip bp-prog" role="img" aria-label="${T(`Bubble ${Math.min(n, G.pi + 1)} of ${n}`, `Burbuja ${Math.min(n, G.pi + 1)} de ${n}`)}"><span aria-hidden="true">${G.stage.e}</span>${G.stage.kinds.map((_, i) => `<i class="${i < G.pi || (i === G.pi && G.between > 0) ? 'on' : i === G.pi ? 'now' : ''}"></i>`).join('')}</div>`;
}
function ensureShell() { if (hudEl) return; hudEl = E.shell({ title: 'Bubble Pop Counting', onPause: pause, party: false }).hud; }

/* ---------------- flow ---------------- */
async function startStage(si, { skipGate = false } = {}) {
  if (!skipGate && !(await E.platformStart('bubbles'))) return;
  closeScreens(); ensureShell(); G = freshG('play', si); card.hidden = false; doneBtn.hidden = true; layout(); clearBubbles(false); P.clear();
  if (music) music.stop(); music = E.music(E.SONGS.chill);
  K.speak(G.stage.intro); nextPrompt(true);
}
function nextPrompt(first = false) {
  G.pi++; if (G.pi >= G.stage.kinds.length) { finishSet(); return; }
  G.prompt = makePrompt(G.stage, G.pi); G.popped = 0; G.missesHere = 0; G.between = 0; G.lastHint = -9;
  K.instruct(promptLine(G.prompt), { interrupt: !first });
  // a few bubbles already on the way so nobody waits; the right one is always among them
  const { max } = cfg(), n = Math.max(2, max - 1);
  for (let k = 0; k < n; k++) spawn(k === 1, V.bottom + (V.top - V.bottom) * (k / n) * .78 - V.r * .3);
  G.spawnT = 1.2; drawCard(); hud();
}
function finishSet() {
  G.mode = 'reward'; G.prompt = null; card.hidden = true; clearBubbles(true); if (music) { music.stop(); music = null; }
  const stars = G.misses <= 2 ? 3 : 2; G.stars = stars; const id = G.stage.id; S.stars[id] = Math.max(S.stars[id] || 0, stars); S.sets++; S.pops += G.pops;
  let st = STICKERS.findIndex((_, i) => !S.stickers.includes(i)); if (st < 0) st = S.sets % STICKERS.length; else S.stickers.push(st); G.sticker = st; save();
  G.overlay = K.rewardOverlay({ stars, max: 3, sticker: STICKERS[st], title: T('Hooray!', '¡Bravo!') });
  K.speak({ en: `Hooray! You earned ${stars} stars and a new sticker!`, es: `¡Bravo! ¡Ganaste ${K.numberWord(stars, 'es', 'f')} estrellas y una calcomanía nueva!` });
  SFX.win(); cheerBurst(1); WH.hop = 1.4; G.rewardT = 3.4; hud();
}
function showResults() {
  if (G.overlay) { G.overlay.remove(); G.overlay = null; } G.mode = 'done'; $('cursor').hidden = true;
  const si = G.si, st = G.stage, next = si + 1 < STAGES.length ? si + 1 : -1, stars = G.stars;
  const xp = 30 + si * 6 + stars * 5, coins = 6 + stars * 3 + si;
  const r = E.results({ gameId: 'bubbles', title: `${st.e} ${T(st.name)}`, stats: [[T('Stars', 'Estrellas'), '⭐'.repeat(stars)], [T('Bubbles popped', 'Burbujas'), G.pops], [T('Sticker', 'Calcomanía'), STICKERS[G.sticker]]], xp, coins, won: true, onAgain: () => startStage(stars >= 3 && next >= 0 ? next : si, { skipGate: true }) });
  const again = r.querySelector('[data-a=again]'); if (again) again.textContent = stars >= 3 && next >= 0 ? T('Next ▶', 'Siguiente ▶') : T('Again ↻', 'Otra vez ↻');
  const menu = document.createElement('button'); menu.className = 'ig-btn ghost'; menu.textContent = T('🫧 Games', '🫧 Juegos'); menu.onclick = () => { r.remove(); title(); }; r.querySelector('.ig-row').prepend(menu);
  return r;
}
async function startParty({ skipGate = false } = {}) {
  if (!skipGate && !(await E.platformStart('bubbles'))) return;
  closeScreens(); ensureShell(); G = freshG('party', -1); G.ease = .4; card.hidden = false; doneBtn.hidden = false; layout(); clearBubbles(false); P.clear();
  if (music) music.stop(); music = E.music(E.SONGS.bright);
  K.instruct({ en: 'Pop party! Pop as many bubbles as you like. Tap All done when you finish.', es: '¡Fiesta de burbujas! Revienta todas las que quieras. Toca Ya terminé cuando acabes.' });
  for (let k = 0; k < 5; k++) spawn(false, V.bottom + (V.top - V.bottom) * (k / 5) * .7);
  drawCard(); hud();
}
function endParty() {
  if (!G || G.mode !== 'party') return; G.mode = 'done'; doneBtn.hidden = true; card.hidden = true; clearBubbles(true); if (music) { music.stop(); music = null; } $('cursor').hidden = true;
  S.pops += G.pops; save(); K.speak({ en: `What a party! You popped ${G.pops} bubbles.`, es: `¡Qué fiesta! Reventaste ${G.pops} burbujas.` });
  const xp = Math.min(40, 10 + G.pops), coins = Math.min(12, 2 + Math.floor(G.pops / 4));
  const r = E.results({ gameId: 'bubbles', title: `🎉 ${T('Pop party', 'Fiesta de burbujas')}`, stats: [[T('Bubbles popped', 'Burbujas'), G.pops]], xp, coins, onAgain: () => startParty({ skipGate: true }) });
  const menu = document.createElement('button'); menu.className = 'ig-btn ghost'; menu.textContent = T('🫧 Games', '🫧 Juegos'); menu.onclick = () => { r.remove(); title(); }; r.querySelector('.ig-row').prepend(menu);
  return r;
}
function pause() {
  if (!G || G.paused || (G.mode !== 'play' && G.mode !== 'party')) return; G.paused = true; if (music) { music.stop(); music = null; } try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) { }
  E.pauseMenu({ onResume: () => { G.paused = false; music = E.music(G.mode === 'party' ? E.SONGS.bright : E.SONGS.chill); K.repeat(); }, onRestart: () => G.mode === 'party' ? startParty({ skipGate: true }) : startStage(G.si, { skipGate: true }) });
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
function closeScreens() { document.querySelectorAll('.ig-screen:not(.kd-gate),.kd-reward').forEach(e => e.remove()); }

/* ---------------- title: stage picker, Pop party, sticker book, grown-ups ---------------- */
const recommended = () => { const i = STAGES.findIndex(s => (S.stars[s.id] || 0) < 3); return i < 0 ? 0 : i; };
function title() {
  closeScreens(); if (G && G.overlay) G.overlay.remove(); G = null; card.hidden = true; doneBtn.hidden = true; clearBubbles(true); if (music) { music.stop(); music = null; } hud(); $('cursor').hidden = true;
  const rec = recommended();
  const extra = `<div class="bp-extra"><div class="bp-stages" id="bpStages"></div><div id="bpParty"></div><div><p class="bp-lbl">${T('Sticker book', 'Álbum de calcomanías')} · ${S.stickers.length}/${STICKERS.length}</p><div class="bp-stickers" role="img" aria-label="${T(`${S.stickers.length} of ${STICKERS.length} stickers`, `${S.stickers.length} de ${STICKERS.length} calcomanías`)}">${STICKERS.map((s, i) => `<span class="${S.stickers.includes(i) ? '' : 'off'}" aria-hidden="true">${S.stickers.includes(i) ? s : '🫧'}</span>`).join('')}</div></div><button type="button" class="ig-chipbtn bp-grown" data-kids-gate="1" id="bpGrown">👪 ${T('Grown-ups', 'Adultos')}</button></div>`;
  const d = E.titleScreen({ title: 'Bubble Pop Counting', kicker: T('Inoa Games · Ages 3–6 · Counting', 'Inoa Games · De 3 a 6 años · Contar'), lead: T('Listen, then pop the bubble the voice asks for. No clock and no way to lose: just counting, popping and stickers.', 'Escucha y revienta la burbuja que pide la voz. Sin reloj y sin perder: solo contar, reventar y calcomanías.'), how: [['🔊', T('A voice says what to pop. Tap the yellow speaker to hear it again', 'Una voz dice qué reventar. Toca la bocina amarilla para escucharlo otra vez')], ['⌨️', T('Arrows + Space · gamepad or phone: stick + A', 'Flechas + Espacio · mando o teléfono: palanca + A')]], extra, onPlay: () => startStage(recommended(), { skipGate: true }) });
  const box = d.querySelector('#bpStages');
  STAGES.forEach((s, i) => { const stv = S.stars[s.id] || 0; const b = K.bigButton({ icon: s.e, text: T(s.name), label: `${T(s.name)} · ${stv}/3 ${T('stars', 'estrellas')}`, cls: 'bp-stage' + (i === rec ? ' rec' : ''), onClick: () => { E.audio(); startStage(i); } }); b.dataset.stage = i; const sm = document.createElement('small'); sm.setAttribute('aria-hidden', 'true'); sm.textContent = '★'.repeat(stv) + '☆'.repeat(3 - stv); b.appendChild(sm); box.appendChild(b); });
  d.querySelector('#bpParty').appendChild(K.bigButton({ icon: '🎉', text: T('Pop party', 'Fiesta de burbujas'), cls: 'bp-party', onClick: () => { E.audio(); startParty(); } }));
  d.querySelector('#bpGrown').addEventListener('click', grownups);
  setTimeout(() => d.querySelector('.bp-stage.rec')?.focus({ preventScroll: true }), 60);
  return d;
}
// Grown-ups panel: opened only through the parent gate (data-kids-gate on its button); its own links are not gated twice.
function grownups() {
  const d = document.createElement('div'); d.className = 'ig-screen'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.dataset.kidsUnlocked = '1'; d.id = 'bpGrownPanel';
  const draw = () => { d.innerHTML = `<div class="ig-card"><h2>👪 ${T('For grown-ups', 'Para adultos')}</h2><p class="ig-sub">${T('Bubble Pop Counting saves only stars and stickers on this device. No names, no chat, no ads.', 'Bubble Pop Counting solo guarda estrellas y calcomanías en este dispositivo. Sin nombres, sin chat, sin anuncios.')}</p>
    <div class="bp-opts"><button type="button" class="ig-chipbtn ${S.hc ? 'on' : ''}" data-o="hc" aria-pressed="${S.hc}">🔲 ${T('High contrast', 'Alto contraste')}<small>${T('Black and white bubbles, thick outlines', 'Burbujas en blanco y negro, bordes gruesos')}</small></button><button type="button" class="ig-chipbtn ${S.calm ? 'on' : ''}" data-o="calm" aria-pressed="${S.calm}">🐢 ${T('Calm bubbles', 'Burbujas tranquilas')}<small>${T('Fewer, slower bubbles from the start', 'Menos burbujas y más lentas desde el principio')}</small></button></div>
    <div class="ig-row"><button type="button" class="ig-btn ghost" data-a="settings">⚙️ ${T('Settings', 'Ajustes')}</button><button type="button" class="ig-btn ghost" data-a="phones">📱 ${T('Phones', 'Teléfonos')}</button></div>
    <div class="ig-row"><a class="ig-btn ghost" href="../index.html">⌂ ${T('All games', 'Todos los juegos')}</a><button type="button" class="ig-btn" data-a="close">${T('Done', 'Listo')}</button></div></div>`;
    d.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { const k = b.dataset.o; S[k] = !S[k]; save(); applyHC(); for (const x of bubbles) if (x.state !== 'off') drawBubble(x); drawCard(); SFX.click(); draw(); });
    d.querySelector('[data-a=settings]').onclick = () => E.settingsPanel(); d.querySelector('[data-a=phones]').onclick = () => E.NET.partyPanel({}); d.querySelector('[data-a=close]').onclick = () => { d.remove(); if (document.querySelector('.ig-title')) title(); }; };
  draw(); document.body.appendChild(d); setTimeout(() => d.querySelector('[data-a=close]')?.focus({ preventScroll: true }), 30); return d;
}
K.guardLinks();
// language switch from the shared settings panel: rebuild the visible text in place (the settings panel stays on top)
addEventListener('inoa:settings', e => { if (!e.detail || e.detail.key !== 'lang') return; hud(); drawCard(); doneBtn.querySelector('.kd-txt').textContent = T('All done', 'Ya terminé'); doneBtn.setAttribute('aria-label', T('All done', 'Ya terminé')); card.querySelector('.kd-repeat').setAttribute('aria-label', T('Hear it again', 'Escúchalo otra vez'));
  if (document.querySelector('.ig-title')) { const keep = [...document.querySelectorAll('.ig-settings, #bpGrownPanel')]; keep.forEach(k => k.remove()); title(); keep.forEach(k => document.body.appendChild(k)); } });

/* ---------------- update loop ---------------- */
function update(dt) {
  const s = input.poll();
  if (s.pausePressed) pause();
  for (const r of rings) if (r.s.visible) { r.t += dt * 2.2; const k = r.t; r.s.scale.setScalar(r.r * 2 * (1 + k * .8)); r.s.material.opacity = Math.max(0, .9 * (1 - k)); if (k >= 1) r.s.visible = false; }
  // whale: idle bob, hops on success, a curious tilt on a miss
  const tt = performance.now() / 1000, rm = E.reducedMotion(); WH.hop = Math.max(0, WH.hop - dt * 1.6); WH.tilt = Math.max(0, WH.tilt - dt * 1.4);
  whale.position.y = .2 + Math.sin(tt * 1.6) * (rm ? .03 : .1) + Math.sin(Math.min(1, WH.hop) * Math.PI) * (rm ? .2 : 1.1); whale.rotation.z = Math.sin(WH.tilt * Math.PI) * .25; whale.rotation.y = Math.sin(tt * .5) * .15; whale.userData.tail.rotation.x = -.6 + Math.sin(tt * 2.4) * .18;
  for (const m of ripples) { m.userData.t += dt; const k = (m.userData.t % 3.6) / 3.6; m.scale.setScalar(1.2 + k * 4); m.material.opacity = .35 * (1 - k); }
  P.update(dt);
  if (!G || G.paused) { updateCursor(dt, s); return; }
  G.t += dt;
  if (G.mode === 'reward') { G.rewardT -= dt; if (G.rewardT <= 0) showResults(); }
  if (G.mode === 'play' && G.between > 0) { G.between -= dt; if (G.between <= 0) nextPrompt(); }
  // spawner
  if ((G.mode === 'play' && G.prompt && G.between <= 0) || G.mode === 'party') { G.spawnT -= dt; const c = cfg(); if (G.spawnT <= 0 && active() < c.max) { spawn(G.mode === 'play' && needsCorrect()); G.spawnT = c.travel / c.max * rnd(.75, 1.15); } else if (G.mode === 'play' && needsCorrect() && active() >= c.max) { /* make room: the highest wrong bubble drifts off */ let hi = null; for (const b of bubbles) if (b.state === 'rise' && !isCorrect(b) && (!hi || b.y > hi.y)) hi = b; if (hi && hi.y > V.bottom + (V.top - V.bottom) * .4) { hi.state = 'away'; hi.t = 0; } } }
  const wob = rm ? .06 : .22;
  for (const b of bubbles) {
    if (b.state === 'off') continue; b.t += dt;
    if (b.state === 'rise') { b.y += b.vy * dt; b.x = b.bx + Math.sin(b.t * .9 + b.ph) * wob * b.r; const br = 1 + Math.sin(b.t * 2.2 + b.ph) * (rm ? .005 : .025); let sc = b.r * br;
      if (b.hint) { sc *= 1 + .07 * (.5 + .5 * Math.sin(b.t * 6)); b.sp -= dt; if (b.sp <= 0 && !rm) { b.sp = .5; P.burst(_p.set(b.x + rnd(-1, 1) * b.r * .8, b.y + rnd(-1, 1) * b.r * .8, b.z + .4), { color: 0xfff1a8, n: 3, speed: .6, up: .8, size: .35, life: .6, gravity: 0, additive: true }); } }
      b.g.scale.setScalar(sc); if (b.y > V.top - b.r * .3) { b.state = 'away'; b.t = 0; } }
    else if (b.state === 'away') { b.y += b.vy * 1.4 * dt; b.x += Math.sin(b.t * 9) * (rm ? 0 : .02); const k = Math.min(1, b.t / .9); b.face.material.opacity = 1 - k; b.mat.opacity = (S.hc ? .1 : .2) * (1 - k); if (k >= 1) { b.state = 'off'; b.g.visible = false; b.mat.opacity = S.hc ? .1 : .2; } }
    else if (b.state === 'pop') { const k = Math.min(1, b.t / .16); b.g.scale.setScalar(b.r * (1 + k * .35)); b.face.material.opacity = 1 - k; b.shell.visible = k < .5; if (k >= 1) { b.state = 'off'; b.g.visible = false; } }
    b.g.position.set(b.x, b.y, b.z);
  }
  updateCursor(dt, s);
}

/* ---------------- boot ---------------- */
ld.set(1); layout(); title(); ld.done(); window.__READY = true;
E.loop(dt => { update(dt); R.render(dt); });

// test hooks (headless harness)
const view = b => ({ i: b.i, val: b.val, kind: b.kind, correct: !!isCorrect(b), hint: b.hint, x: innerWidth / 2 + b.x * V.ppu, y: innerHeight / 2 - b.y * V.ppu, d: 2 * b.r * V.ppu });
window.__GAME = {
  get state() { return G ? { mode: G.mode, stage: G.si, pi: G.pi, kind: G.prompt && G.prompt.kind, answer: G.prompt && G.prompt.answer, need: G.prompt && G.prompt.need, popped: G.popped, misses: G.misses, missesHere: G.missesHere, ease: +G.ease.toFixed(2), pops: G.pops, between: G.between, paused: G.paused, partyN: G.partyN, active: active() } : { mode: 'title' }; },
  S, STAGES, update, title, startStage: i => startStage(i, { skipGate: true }), startParty: () => startParty({ skipGate: true }), endParty, layout,
  prompt: () => G && G.prompt ? { kind: G.prompt.kind, answer: G.prompt.answer, need: G.prompt.need, popped: G.popped, text: K.lastLine() } : null,
  bubbles: () => bubbles.filter(b => b.state === 'rise').map(view),
  // make sure a matching (or non-matching) bubble is on screen and return it (screen coordinates for real taps)
  ensure(correct = true) { if (!G || (G.mode !== 'play' && G.mode !== 'party')) return null; let b = bubbles.find(x => x.state === 'rise' && !!isCorrect(x) === correct && x.y > V.bottom + V.r && x.y < V.top - V.r * 1.5); if (!b) { const y = V.bottom + (V.top - V.bottom) * .45; b = spawn(correct, y); if (b && !correct && isCorrect(b)) { b.val = G.prompt.answer === G.prompt.lo ? G.prompt.answer + 1 : G.prompt.answer - 1; drawBubble(b); } } return b ? view(b) : null; },
  popIndex: i => tryPop(bubbles[i]), popValue(v) { const b = bubbles.find(x => x.state === 'rise' && x.val === v); return b ? tryPop(b) : null; },
  popCorrect() { const v = this.ensure(true); return v ? tryPop(bubbles[v.i]) : false; }, popWrong() { const v = this.ensure(false); return v ? tryPop(bubbles[v.i]) : null; },
  tapAt, cursor: () => ({ on: cur.on, x: cur.x, y: cur.y, lock: cur.lock ? cur.lock.i : -1 }),
  minBubblePx: () => Math.round(2 * V.r * V.ppu), minTargetPx: () => K.minTargetPx(), gate: () => K.guardStats(), gateOpen: () => K.gateOpen(), lastLine: () => K.lastLine(), V
};
</script>
