.jk-pal button.on{box-shadow:0 0 0 3px var(--ink);transform:scale(1.12)}
.jk-pal .lbl{width:100%;text-align:center;font-weight:800;font-size:13px}

{

  const done = VEH.map((v, i) => i).filter(i => S.garage[VEH[i].id]); if (!done.length) { E.toast(T('Restore a car first — it will park here!', '¡Restaura un coche primero y se aparcará aquí!'), 2200); title(); return; }
  if (!done.includes(vi)) vi = done[0]; startVehicle(vi, 'gallery'); lampLevel(1); hideHud();
  const cta = document.createElement('div'); cta.className = 'jk-cta'; const g = S.garage[VEH[vi].id];
  cta.innerHTML = `<button class="ig-btn ghost" data-a="prev" aria-label="${T('Previous', 'Anterior')}">◀</button><button class="ig-btn ghost" data-a="menu">${T('Menu', 'Menú')}</button><button class="ig-btn" data-a="cmp">${T('Day 1 vs 30', 'Día 1 vs 30')}</button><button class="ig-btn ghost" data-a="next" aria-label="${T('Next', 'Siguiente')}">▶</button>`;
  document.body.appendChild(cta); const at = done.indexOf(vi);
  cta.querySelector('[data-a=prev]').onclick = () => gallery(done[(at - 1 + done.length) % done.length]); cta.querySelector('[data-a=next]').onclick = () => gallery(done[(at + 1) % done.length]);
  cta.querySelector('[data-a=menu]').onclick = () => title(); cta.querySelector('[data-a=cmp]').onclick = () => { cta.remove(); G.phase = 'slider'; showSlider(false); };
  E.toast(`${vn(VEH[vi])} · ${T(g.name, (COLORS.find(c => c[0] === g.name) || [])[2])}`, 2000);
}
function hideHud() { if (hudEl) { hudEl.pad.hidden = true; document.querySelector('.ig-top').hidden = true; } $('steps').hidden = true; }

/* ---------------- camera ---------------- */
// free screen band between the top HUD (+ step chip) and the bottom controls (spin buttons / colour palette)
function freeBand() {
  let top = 64, bot = innerHeight - 24; const q = sel => { const e = document.querySelector(sel); if (!e || e.hidden || e.offsetParent === null && getComputedStyle(e).position !== 'fixed') return null; const r = e.getBoundingClientRect(); return r.height ? r : null; };
  const hudR = q('.ig-top'); if (hudR && G.mode === 'play') top = Math.max(top, hudR.bottom + 6); const stR = q('#steps'); if (stR && innerHeight > innerWidth) top = Math.max(top, stR.bottom + 4);
  const pad = q('.ig-pad .ig-btns'); if (pad && G.mode === 'play' && innerHeight > innerWidth) bot = Math.min(bot, pad.top - 6); const pal = q('.jk-pal'); if (pal && innerHeight > innerWidth) bot = Math.min(bot, pal.top - 6);
  if (bot - top < innerHeight * .35) { top = 64; bot = innerHeight - 24; } return { top, bot };
}
function fitCam(snap) {
  const portrait = innerHeight > innerWidth; const vf = THREE.MathUtils.degToRad(camera.fov / 2), hf = Math.atan(Math.tan(vf) * camera.aspect);
  if (!portrait) { const r = G.radius * .92; G.dist = r / Math.sin(Math.min(vf * .92, hf)) * 1.02; G.lookOff = 0; }
  else {
    // phones: frame the spinning car by its footprint (widest = the diagonal) instead of a loose bounding sphere, and centre it in the free band
    const sz = G.grid.size, rh = Math.hypot(sz.x, sz.z) / 2 - .12, hy = sz.y - .24, tv = Math.tan(vf), th = tv * camera.aspect; const band = freeBand(), bandN = (band.bot - band.top) / innerHeight;
    const pt = G.pitchT, vext = hy * Math.cos(pt) + 2 * rh * Math.sin(pt);
    G.dist = Math.max(rh / (th * .97), vext / 2 / (tv * bandN * .9), 4); G.lookOff = 1 - (band.top + band.bot) / innerHeight; // NDC: + moves the car up
  }
  if (snap || G.distNow == null) { G.pitch = G.pitchT; G.distNow = G.dist; G.offNow = G.lookOff; }
}
function updateCamera(dt) {
  if (!G) return; G.pitch = damp(G.pitch, G.pitchT, .02, dt);
  if (G.sliderAnim >= 0 && G.phase === 'slider') { G.sliderAnim += dt; const t = G.sliderAnim; if (t < 2.4) G.setSplit(.5 + Math.sin(t / 2.4 * Math.PI * 2) * .35); else { G.setSplit(.5); G.sliderAnim = -1; } }
  const tgt = G.car.localToWorld(G.center.clone()); tgt.y = Math.max(tgt.y * .9, .9);
  G.distNow = damp(G.distNow ?? G.dist, G.dist, .01, dt); G.offNow = damp(G.offNow ?? 0, G.lookOff || 0, .01, dt);
  const d = G.distNow * (G.zoom || 1); const az = G.az, pt = G.pitch;
  camera.position.set(tgt.x + Math.sin(az) * Math.cos(pt) * d, tgt.y + Math.sin(pt) * d, tgt.z + Math.cos(az) * Math.cos(pt) * d); camera.lookAt(tgt);
  // shift the framing so the car sits in the middle of the band left free by the HUD (look slightly below the car to move it up)
  if (G.offNow) { camUp.set(0, 1, 0).applyQuaternion(camera.quaternion); camera.lookAt(tgt.addScaledVector(camUp, -G.offNow * d * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)))); }
}
addEventListener('resize', () => { if (G) fitCam(false); });
// re-frame when the language changes (text widths) or bottom UI appears
addEventListener('inoa:settings', e => { if (!e.detail || e.detail.key !== 'lang') return; hudKey = ''; hud(true); steps(); if (document.querySelector('.ig-title')) title(); });
function pause() { if (!G || G.paused || G.mode !== 'play' || G.phase !== 'play') return; G.paused = true; G.brush = null; hissSet(false); music && music.stop(); E.pauseMenu({ onResume: () => { G.paused = false; music = E.music(E.SONGS.chill); }, onRestart: () => startVehicle(G.vi), extra: `<p class="ig-sub">${vn(G.V)} · ${T('step', 'paso')} ${G.stage + 1}/4 · ${sname(STAGES[G.stage])}</p>` }); }
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------------- title ---------------- */
function title() {
  cleanupUI(); document.querySelectorAll('.ig-screen').forEach(e => e.remove()); if (music) music.stop(); music = null;
  startVehicle(Math.min(S.sel, S.unlocked - 1), 'attract'); G.phase = 'gallery'; hideHud(); lampLevel(.3);
  const vs = VEH.map((v, i) => { const g = S.garage[v.id]; const lock = i >= S.unlocked; return `<button data-i="${i}" class="${i === S.sel ? 'on' : ''}" ${lock ? 'disabled' : ''}>${lock ? '🔒 ' : g ? `<i style="background:#${new THREE.Color(g.color).getHexString(THREE.SRGBColorSpace)}"></i>` : ''}${vn(v)}<small>${lock ? T('Restore the one before', 'Restaura el anterior') : g ? T('Restored · ', 'Restaurado · ') + T(g.name, (COLORS.find(c => c[0] === g.name) || [])[2]) : T(v.story, v.storyEs)}</small></button>`; }).join('');
  const n = Object.keys(S.garage).length;
  const extra = `<div class="jk-extra"><div><div class="jk-lbl">${T('Pick a junker', 'Elige una chatarra')}</div><div class="pick" id="pV">${vs}</div></div><div class="ig-row"><button class="ig-chipbtn" id="gal" ${n ? '' : 'disabled'}>🏁 ${T('Garage gallery', 'Galería del garaje')} (${n}/${VEH.length})</button></div></div>`;
  const d = E.titleScreen({ title: 'Junkyard to Jewel', kicker: T('Inoa Games · Restoration 3D', 'Inoa Games · Restauración 3D'), lead: T('Rescue rusty old rides. Wash, sand, paint and polish them back to showroom shine.', 'Rescata coches viejos y oxidados. Lávalos, líjalos, píntalos y púlelos hasta que brillen como nuevos.'), how: [['🚿', T('Drag across the car to wash, sand, paint and polish', 'Arrastra sobre el coche para lavar, lijar, pintar y pulir')], ['🔄', T('Drag the floor or tap ⟲ ⟳ to spin the turntable', 'Arrastra el suelo o toca ⟲ ⟳ para girar la plataforma')], ['⌨️', T('Arrows / stick spin and tilt · hold Space or A to work', 'Flechas / palanca giran e inclinan · mantén Espacio o A para trabajar')]], extra, onPlay: () => startVehicle(S.sel) });
  d.querySelectorAll('#pV button').forEach(b => b.onclick = () => { S.sel = +b.dataset.i; save(); d.querySelectorAll('#pV button').forEach(x => x.classList.toggle('on', x === b)); startVehicle(S.sel, 'attract'); G.phase = 'gallery'; hideHud(); lampLevel(.3); });
  d.querySelector('#gal').onclick = () => gallery(S.sel);
  setTimeout(() => d.querySelector('[data-a=play]')?.focus(), 50);
}


// gamepad A presses the main button of whichever menu card is open; Play gets keyboard focus
let padPrevA = false;
function menuPad() { const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; const a = pads.some(p => p.buttons[0] && p.buttons[0].pressed); if (a && !padPrevA) { const b = document.querySelector('.ig-screen [data-a=play], .ig-screen [data-a=again], .ig-screen [data-a=resume], .jk-cta [data-a=go]'); if (b) b.click(); } padPrevA = a; }
title(); ld.done(); window.__READY = true;
E.loop((dt) => { menuPad(); update(dt); updateCamera(dt); R.render(dt); });
window.__GAME = {
  get G() { return G; }, S, VEH, STAGES, COLORS, update, startVehicle, title, gallery, finish, setColor, progress: ch => progress(ch),
  // test hook: scrub the current stage over a fraction of exterior voxels (same paint path as the pointer)
  autoScrub(frac = 1) { if (!G || G.phase !== 'play') return 0; if (G.stage === 2 && G.colorIdx < 0) setColor(3); const st = STAGES[G.stage], g = G.grid, w = G.W[G.stage]; const p = new THREE.Vector3(); let n = 0; for (let i = 0; i < G.ext.length; i += 3) { if (!w[i] || Math.random() > frac) continue; const k = G.ext[i]; const x = k % g.nx, y = Math.floor(k / g.nx) % g.ny, z = Math.floor(k / (g.nx * g.ny)); p.set(g.min.x + (x + .5) * g.cell, g.min.y + (y + .5) * g.cell, g.min.z + (z + .5) * g.cell); paintAt(p, G.stage, st.rad * .8, 1); n++; } G.prog[G.stage] = progress(G.stage); return G.prog[G.stage]; },
  carScreen: () => E.toScreen(G.car.localToWorld(G.center.clone()), camera), U,
  // test hooks: where the pointer ray meets the car (back on screen) and the mask value painted at that exact voxel
  hitScreen: (x, y) => { const h = hitCar(x, y); return h ? E.toScreen(h.point, camera) : null; },
  maskAt: (x, y, ch) => { const h = hitCar(x, y); if (!h) return -1; const g = G.grid, lp = G.car.worldToLocal(h.point.clone()); const vx = Math.floor((lp.x - g.min.x) / g.cell), vy = Math.floor((lp.y - g.min.y) / g.cell), vz = Math.floor((lp.z - g.min.z) / g.cell); let m = 0; for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const X = vx + dx, Y = vy + dy, Z = vz + dz; if (X < 0 || Y < 0 || Z < 0 || X >= g.nx || Y >= g.ny || Z >= g.nz) continue; m = Math.max(m, G.mask[(X + Y * g.nx + Z * g.nx * g.ny) * 4 + ch]); } return m; },
  carRectPx: () => { const pts = [], v = new THREE.Vector3(); for (const o of G.meshes) { const pa = o.geometry.attributes.position, st = Math.max(1, Math.floor(pa.count / 400)); for (let i = 0; i < pa.count; i += st) pts.push(E.toScreen(v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld), camera)); } const xs = pts.map(p => p.x), ys = pts.map(p => p.y); return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys), vw: innerWidth, vh: innerHeight }; },
  brushing: () => !!(G && G.brush)
};
</script>
