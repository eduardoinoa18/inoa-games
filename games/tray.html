.ft-rep .stamp.on{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}

.lv button small{font-size:12px;letter-spacing:1px;color:#e0a100}

.lv button.lock{opacity:.45}

/* ================= engine ================= */
const ld = E.loading('Fail Tray', 'Stacking the plates…');
const R = E.createRenderer($('gl'), { fov: 55, portraitFov: 72, shadowSize: 14, far: 500 });
const { scene, camera, sun } = R;
await E.loadPack('../packs/tray.json', R, p => ld.set(p));
R.setLook({ skyTop: 0x4d8fd6, skyHor: 0xf6dcc0, skyGlow: 0xffe2b0, sunDir: [.5, .35, -.8], fog: 0xe8dccb, fogNear: 50, fogFar: 170, sun: 1.75, sunColor: 0xffe6c4, hemi: .5, ground: 0x7a8a55, exposure: .92, env: .2, bloom: .12, clouds: true });

const input = E.createInput({ surface: $('gl') });
const P = new E.Particles(scene);
const S = Object.assign({ stars: {}, best: {}, players: 1, names: ['Ana', 'Leo', 'Mia', 'Rafa'], level: 0, cup: 'one', chaos: false }, E.store.get('inoa.tray', {}));
const save = () => E.store.set('inoa.tray', S);
let G = null, music = null, hudEl = null;
window.__AUTO = false;

/* ================= static world ================= */
const world = new THREE.Group(); scene.add(world);
const course = new THREE.Group(); scene.add(course);
{
  const ground = new THREE.Mesh(new THREE.CircleGeometry(220, 64), E.pbr('grass', 0x93c46c, [60, 60], { bump: 1.5 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; world.add(ground);
}
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }
const stripeTex = canvasTex(128, 32, (g, w, h) => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#f4f1e8' : '#e2443a'; g.fillRect(i * 16, 0, 16, h); } });
const hazardTex = canvasTex(128, 32, (g, w, h) => { g.fillStyle = '#ffd166'; g.fillRect(0, 0, w, h); g.fillStyle = '#1b2430'; for (let i = -2; i < 10; i++) { g.beginPath(); g.moveTo(i * 16, h); g.lineTo(i * 16 + 8, h); g.lineTo(i * 16 + 24, 0); g.lineTo(i * 16 + 16, 0); g.fill(); } });
hazardTex.wrapS = THREE.RepeatWrapping;
const splatTex = canvasTex(128, 128, (g) => { g.fillStyle = '#fff'; g.beginPath(); for (let i = 0; i <= 24; i++) { const a = i / 24 * Math.PI * 2, r = 40 + hash(i, 3) * 22; i ? g.lineTo(64 + Math.cos(a) * r, 64 + Math.sin(a) * r) : g.moveTo(64 + Math.cos(a) * r, 64 + Math.sin(a) * r); } g.fill(); for (let i = 0; i < 10; i++) { g.beginPath(); g.arc(64 + (hash(i, 9) - .5) * 120, 64 + (hash(i, 11) - .5) * 120, 4 + hash(i, 5) * 8, 0, 7); g.fill(); } });

/* ================= custom items ================= */
function makeCustom(kind) {
  const g = new THREE.Group();
  if (kind === 'jelly') {
    const pts = []; for (let i = 0; i <= 12; i++) { const t = i / 12; pts.push(new THREE.Vector2(.09 * (1 - Math.pow(t, 3) * .55) + .004 * Math.sin(t * 18), t * .15)); } pts.push(new THREE.Vector2(0, .15));
    const body = new THREE.Mesh(new THREE.LatheGeometry(pts, 24), new THREE.MeshStandardMaterial({ color: 0x45d47a, roughness: .12, metalness: .05, transparent: true, opacity: .82, emissive: 0x1d7a3f, emissiveIntensity: .35 })); body.castShadow = true; g.add(body);
    const cherry = new THREE.Mesh(new THREE.SphereGeometry(.028, 14, 10), new THREE.MeshStandardMaterial({ color: 0xd2202e, roughness: .25 })); cherry.position.y = .165; g.add(cherry);
    const plate = new THREE.Mesh(new THREE.CylinderGeometry(.115, .1, .012, 24), E.mat(0xffffff, { roughness: .3 })); plate.position.y = .006; plate.receiveShadow = true; g.add(plate); body.position.y = .012; g.userData.wobble = body;
  } else if (kind === 'ice') {
    const m = new THREE.Mesh(new THREE.BoxGeometry(.17, .14, .17, 2, 2, 2), new THREE.MeshStandardMaterial({ color: 0xcfefff, roughness: .04, metalness: .1, transparent: true, opacity: .72, emissive: 0x6fb8e0, emissiveIntensity: .25 })); m.position.y = .07; m.castShadow = true; g.add(m);

  } else if (kind === 'anvil') {

    for (const [w, h, d, x, y, z] of parts) { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M); b.position.set(x, y, z); b.castShadow = true; g.add(b); }

    g.rotation.y = 0;
  }

}
function makeItem(id) {
  const d = ITEMS[id]; const mesh = new THREE.Group(); let inner;
  if (d.custom) { inner = makeCustom(d.custom); inner.scale.setScalar(IS); } else inner = E.instance(d.m, { scale: d.w * IS });

}

/* ================= course ================= */
let C = null; // course data
function buildCourse(L) {
  while (course.children.length) course.remove(course.children[0]);
  const smp = []; let x = 0, z = 0, h = 0, y = 0; const segs = [];
  const push = seg => smp.push({ x, z, h, y, seg });
  const adv = () => { x += Math.sin(h) * DS; z += Math.cos(h) * DS; };
  for (const raw of L.segs) {
    const [t, a, b] = raw; const seg = { t, s0: smp.length * DS, y0: y };
    if (t === 'turn') { const len = Math.abs(a) * Math.PI / 180 * b; const n = Math.max(1, Math.round(len / DS)); const dh = a * Math.PI / 180 / n; seg.k = (a > 0 ? 1 : -1) / b; for (let i = 0; i < n; i++) { push(seg); h += dh; adv(); } }
