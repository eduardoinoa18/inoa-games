import * as E from '../engine/inoa3d.js';
const { THREE, clamp, lerp, rnd, pick, hash, damp, SFX, $ } = E;

/* ---------- constants ---------- */

const SKILL = {
  chill: { err: .55, react: .95, spd: .84, range: 6.3, engage: 6.5, bombRate: .08, dmgIn: .65, resp: 2.2, star: 1, label: ['Chill', 'Tranqui'], desc: ['Easy · best for kids', 'Fácil · ideal para niños'] },
  normal: { err: .3, react: .6, spd: .94, range: 7.5, engage: 8.5, bombRate: .22, dmgIn: .85, resp: 3, star: 2, label: ['Normal', 'Normal'], desc: ['A fair fight', 'Una pelea justa'] },
  fierce: { err: .13, react: .38, spd: 1, range: 8.5, engage: 9.5, bombRate: .32, dmgIn: 1, resp: 3, star: 3, label: ['Fierce', 'Feroz'], desc: ['Sharp aim, fast', 'Puntería fina, rápidos'] }
};
const MODES = {
  turf: { label: ['Cover Up', 'Cubre Todo'], desc: ['Most painted floor wins', 'Gana el que más pinte'] },
  pools: { label: ['Tide Pools', 'Pozas de Marea'], desc: ['Hold the 3 glowing pools', 'Domina las 3 pozas'] }
};
// EN/ES: every player-facing line goes through E.L (language comes from the shared settings)
const tr = (en, es) => E.L(en, es);
const teamName = i => i ? tr('Coral', 'Coral') : tr('Teal', 'Turquesa');
const stars = n => '★'.repeat(n) + '☆'.repeat(3 - n);

/* ---------- character-space posing (rig-independent; see runner.html) ---------- */
const ORDER = ['Hips', 'Spine', 'Chest', 'UpperChest', 'Neck', 'Head', 'LeftShoulder', 'LeftArm', 'LeftForeArm', 'LeftHand', 'RightShoulder', 'RightArm', 'RightForeArm', 'RightHand', 'LeftUpLeg', 'LeftLeg', 'LeftFoot', 'RightUpLeg', 'RightLeg', 'RightFoot'];

    (W[e.n] || (W[e.n] = new THREE.Quaternion())).multiplyQuaternions(pw, b.quaternion); }
}
const PZ = {
  idle: t => ({ LeftArm: [Math.sin(t * 2) * .03, 0, -1.3], RightArm: [Math.sin(t * 2) * .03, 0, 1.3], LeftForeArm: [-.2], RightForeArm: [-.2], Head: [0, Math.sin(t * .7) * .25, 0] }),
  legs: (t, k) => { const ph = t * 10, w = Math.sin(ph) * k, c = Math.cos(ph); return { LeftUpLeg: [-w * .75], RightUpLeg: [w * .75], LeftLeg: [(.2 + Math.max(0, c) * 1.1) * k], RightLeg: [(.2 + Math.max(0, -c) * 1.1) * k] }; },
  aim: () => ({ RightArm: [-1.45, 0, 1.3], RightForeArm: [-.25], LeftArm: [-1.25, -.5, -1.3], LeftForeArm: [-.6], Spine: [.12] }),
  cheer: t => ({ LeftArm: [0, 0, 1.15 + Math.sin(t * 9) * .2], RightArm: [0, 0, -1.15 - Math.sin(t * 9) * .2], LeftForeArm: [-.4], RightForeArm: [-.4], Head: [-.25], Spine: [-.08] }),
  sad: () => ({ LeftArm: [.1, 0, -1.35], RightArm: [.1, 0, 1.35], Head: [.55], Spine: [.25] })

/* ---------- engine ---------- */
const ld = E.loading('Tide Lines', E.L('Filling the water cannons…', 'Llenando los cañones de agua…'));
const R = E.createRenderer($('gl'), { fov: 50, portraitFov: 64, far: 600, shadowSize: 27 });
const { scene, camera, sun } = R;
await E.loadPack('../packs/tidelines.json', R, p => ld.set(p));
sun.position.set(14, 30, 12); sun.target.position.set(0, 0, 0); sun.target.updateMatrixWorld();
const input = E.createInput({ surface: $('gl'), pads: 'first' });
const PT = new E.Particles(scene);
const S = Object.assign({ char: 0, skill: 'chill', best: 0, map: 'pier', mode: 'turf', stars: {} }, E.store.get('inoa.tidelines', {}));
if (!S.stars || typeof S.stars !== 'object') S.stars = {};
{ const HERO = E.hero(); if (HERO.chosen && !S.picked) { const k = CHARS.findIndex(c => c.model === HERO.model); if (k >= 0) S.char = k; } } // hub hero is the default painter until one is picked here
const save = () => E.store.set('inoa.tidelines', S);
let G = null, music = null;

/* ---------- arena layout (analytic collision), rebuilt per map ---------- */
// PLATS: raised decks. RAMPS: {ax:'x'|'z', s:+1|-1 = side of the high end}. SOLIDS: props (c:1 = circle). pass:1 = water (blocks walking, not ink)
const PLATS = [], RAMPS = [], SOLIDS = [], ZONES = [];
const sym = (f) => { for (const sx of [-1, 1]) for (const sz of [-1, 1]) f(sx, sz); };
const plat = (x0, x1, z0, z1, h = 1.3) => PLATS.push({ x0, x1, z0, z1, h });
const ramp = (x0, x1, z0, z1, ax, s, h = 1.3) => RAMPS.push({ x0, x1, z0, z1, ax, s, h });
const box = (kind, x, z, w, d, h, o = {}) => SOLIDS.push({ kind, x, z, x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2, h, ...o });
const disc = (kind, x, z, r, h, o = {}) => SOLIDS.push({ kind, c: 1, x, z, r, h, ...o });
function rampU(r, x, z) { const u = r.ax === 'x' ? (x - r.x0) / (r.x1 - r.x0) : (z - r.z0) / (r.z1 - r.z0); return r.s > 0 ? u : 1 - u; }
function groundAt(x, z) { for (const p of PLATS) if (x >= p.x0 && x <= p.x1 && z >= p.z0 && z <= p.z1) return p.h; for (const r of RAMPS) if (x >= r.x0 && x <= r.x1 && z >= r.z0 && z <= r.z1) return rampU(r, x, z) * r.h; return 0; }
const inS = (s, x, z, pad) => s.c ? (x - s.x) ** 2 + (z - s.z) ** 2 < (s.r + pad) ** 2 : x > s.x0 - pad && x < s.x1 + pad && z > s.z0 - pad && z < s.z1 + pad;
function solidAt(x, z, pad = 0) { let h = 0; for (const s of SOLIDS) if (inS(s, x, z, pad)) h = Math.max(h, s.h); return h; }
// what ink sees: water lets blobs fall through to the surface
function solidAtP(x, z) { let h = 0; for (const s of SOLIDS) if (!s.pass && inS(s, x, z, 0)) h = Math.max(h, s.h); return h; }
const waterAt = (x, z) => SOLIDS.some(s => s.pass && inS(s, x, z, 0));
const heightAt = (x, z, pad = 0) => Math.max(groundAt(x, z), solidAt(x, z, pad));
const heightAtP = (x, z) => Math.max(groundAt(x, z), solidAtP(x, z));
const inArena = (x, z, m = 0) => Math.abs(x) < A - .6 - m && Math.abs(z) < A - .6 - m;
// ramp ends: bots walk to the low end, then up and onto the deck
function rampEnds(r) { const xc = (r.x0 + r.x1) / 2, zc = (r.z0 + r.z1) / 2; if (r.ax === 'x') { const lo = r.s > 0 ? r.x0 : r.x1, hi = r.s > 0 ? r.x1 : r.x0; return { lo: { x: lo - r.s * .9, z: zc }, hi: { x: hi + r.s * 1.4, z: zc } }; } const lo = r.s > 0 ? r.z0 : r.z1, hi = r.s > 0 ? r.z1 : r.z0; return { lo: { x: xc, z: lo - r.s * .9 }, hi: { x: xc, z: hi + r.s * 1.4 } }; }

/* ---------- paint: 64×64 coverage grid + 512² canvas texture projected in world XZ ---------- */
const grid = new Int8Array(N * N); let paintable = 0; const counts = [0, 0];
const cx = i => -A + (i + .5) * CELL;
const PC = document.createElement('canvas'); PC.width = PC.height = PAINT_PX; const pg = PC.getContext('2d');
const paintTex = new THREE.CanvasTexture(PC); paintTex.flipY = false; paintTex.colorSpace = THREE.SRGBColorSpace; paintTex.anisotropy = 4;
let paintDirty = true;
// colour-blind cue: teal ink carries light dots, coral ink diagonal stripes (also ● vs ▲ on rings, tags, map and bars)
const INK = TEAMS.map((T, t) => { const c = document.createElement('canvas'); c.width = c.height = 16; const g = c.getContext('2d'); g.fillStyle = T.css; g.fillRect(0, 0, 16, 16);
  if (!t) { g.fillStyle = 'rgba(255,255,255,.34)'; for (const [x, y] of [[4, 4], [12, 12]]) { g.beginPath(); g.arc(x, y, 2.3, 0, 6.3); g.fill(); } }
  else { g.strokeStyle = 'rgba(110,20,10,.26)'; g.lineWidth = 2.6; g.beginPath(); for (const o of [-16, 0, 16]) { g.moveTo(o, 16); g.lineTo(o + 16, 0); } g.stroke(); }
  return pg.createPattern(c, 'repeat'); });
function layoutGrid() {
  paintable = 0; for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const x = cx(i), z = cx(j); const ok = inArena(x, z, -.3) && solidAt(x, z) === 0; grid[j * N + i] = ok ? 0 : -1; if (ok) paintable++; }
  for (const zn of ZONES) { zn.cells = []; for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) if (grid[j * N + i] >= 0 && (cx(i) - zn.x) ** 2 + (cx(j) - zn.z) ** 2 < zn.r * zn.r) zn.cells.push(j * N + i); }
}
const cellOf = (x, z) => { const i = Math.floor((x + A) / CELL), j = Math.floor((z + A) / CELL); return (i < 0 || j < 0 || i >= N || j >= N) ? -1 : j * N + i; };

function nearBase(x, z, team, r = 2.6) { const b = TEAMS[team].base; return (x - b.x) ** 2 + (z - b.z) ** 2 < r * r; }
function paint(x, z, r, team, by, visual = true) {

  if (by) by.painted += flipped; return flipped;
}
function resetPaint() { pg.clearRect(0, 0, PAINT_PX, PAINT_PX); for (let c = 0; c < N * N; c++) if (grid[c] > 0) grid[c] = 0; counts[0] = counts[1] = 0; paintDirty = true; }
// patch any MeshStandardMaterial so it shows the paint layer (glossy, wet) at its world XZ
function paintable_(m) {
  m.onBeforeCompile = sh => {
    sh.uniforms.uPaint = { value: paintTex };
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vPW;').replace('#include <project_vertex>', '#include <project_vertex>\nvPW=(modelMatrix*vec4(transformed,1.)).xyz;');

      .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\nroughnessFactor=mix(roughnessFactor,.16,pnt.a);')
