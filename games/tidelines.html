<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--teal:#16c2b0;--coralT:#ff6f59}
.ig-screen{justify-content:safe center;align-items:safe center}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.pick button{min-height:42px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:800;cursor:pointer;padding:6px}
.pick button.on{border-color:var(--mint-ink);background:var(--mint)}
.pick small{display:block;font-weight:600;color:#4c5868;font-size:11px}
#pC{grid-template-columns:repeat(auto-fill,minmax(66px,1fr))}
.tl-opts{display:grid;gap:10px;align-content:start}.tl-lbl{margin-bottom:6px}
.ig-title .ig-how{align-content:start}.ig-title .ig-how div{padding:6px 10px;font-size:13px}
@media (min-width:760px){.ig-title .ig-card{width:min(880px,100%);grid-template-columns:1fr 1fr;column-gap:22px}.ig-title .ig-card>.ig-kicker,.ig-title .ig-card>h1,.ig-title .ig-card>.ig-sub,.ig-title .ig-card>.ig-row{grid-column:1/-1}}
@media (max-height:620px) and (min-width:760px){.ig-title .ig-card{padding:16px 20px;gap:8px}.ig-title .ig-card h1{font-size:32px}.ig-title .ig-btn{min-height:48px;padding:8px 16px}}
.tl-bar{position:fixed;left:50%;top:60px;transform:translateX(-50%);width:min(520px,calc(100vw - 32px));height:26px;border-radius:14px;background:rgba(255,248,238,.88);overflow:hidden;z-index:19;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none}

.ig-chip.warn{background:#ff6f59;color:#fff;animation:tlp .5s infinite alternate}

.tl-judge .k{font-family:var(--f-b);font-weight:800;letter-spacing:.14em;color:#fff;font-size:13px;opacity:.9;margin-bottom:6px;text-shadow:0 1px 0 rgba(0,0,0,.4)}

@media (max-width:640px){#tlMap{width:92px;height:92px;top:100px;right:10px}.tl-ink{bottom:150px;width:150px}}
</style>

<script type="module">

/* ---------- arena geometry (analytic collision) ---------- */

sym((sx, sz) => { SOLIDS.push({ x0: sx * 5.5 - .7, x1: sx * 5.5 + .7, z0: sz * 11.4 - .7, z1: sz * 11.4 + .7, h: 1.4, kind: 'crate', x: sx * 5.5, z: sz * 11.4 }); SOLIDS.push({ x0: sx * 9.6 - .7, x1: sx * 9.6 + .7, z0: sz * 8 - .7, z1: sz * 8 + .7, h: 2.8, kind: 'crate2', x: sx * 9.6, z: sz * 8 }); SOLIDS.push({ c: 1, x: sx * 3.4, z: sz * 4.6, r: .55, h: 1.2, kind: 'barrel' }); SOLIDS.push({ x0: sx * 16.3 - 1.1, x1: sx * 16.3 + 1.1, z0: sz * 14.6 - 1.1, z1: sz * 14.6 + 1.1, h: .9, kind: 'planter', x: sx * 16.3, z: sz * 14.6 }); });

const sea = new THREE.Mesh(new THREE.PlaneGeometry(700, 700, 120, 120), waterMat); sea.rotation.x = -Math.PI / 2; sea.position.y = -1.6; world.add(sea);
// pier under the plaza + ring deck
const pierTop = new THREE.Mesh(new THREE.BoxGeometry(2 * A + 10, .8, 2 * A + 10), [stone, stone, woodPier, stone, stone, stone]); pierTop.position.y = -.42; pierTop.receiveShadow = true; world.add(pierTop);
const pil = new THREE.InstancedMesh(new THREE.CylinderGeometry(.35, .4, 3, 10), E.pbr('wood', 0x6b4a32, [1, 3]), 40); { const o = new THREE.Object3D(); let n = 0; for (let k = 0; k < 10; k++) for (const [sx, sz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const t = -A - 4 + k * (2 * A + 8) / 9; o.position.set(sx ? sx * (A + 4.6) : t, -2, sz ? sz * (A + 4.6) : t); o.updateMatrix(); pil.setMatrixAt(n++, o.matrix); } pil.castShadow = true; world.add(pil); }

function drawMap() { const c = $('tlMap'), g = c.getContext('2d'), W = c.width; g.clearRect(0, 0, W, W); g.save(); g.beginPath(); g.roundRect(0, 0, W, W, 30); g.clip(); g.fillStyle = '#e9e1d2'; g.fillRect(0, 0, W, W); g.drawImage(PC, 0, 0, W, W); g.fillStyle = 'rgba(27,36,48,.55)'; const k = W / (2 * A); for (const s of SOLIDS) { if (s.c) { g.beginPath(); g.arc((s.x + A) * k, (s.z + A) * k, s.r * k, 0, 6.3); g.fill(); } else g.fillRect((s.x0 + A) * k, (s.z0 + A) * k, (s.x1 - s.x0) * k, (s.z1 - s.z0) * k); } for (const u of units) { if (!u.alive) continue; g.fillStyle = TEAMS[u.team].css; g.strokeStyle = u.isPlayer ? '#ffd166' : '#1b2430'; g.lineWidth = u.isPlayer ? 6 : 3; g.beginPath(); g.arc((u.x + A) * k, (u.z + A) * k, u.isPlayer ? 9 : 6, 0, 6.3); g.fill(); g.stroke(); } g.restore(); }
function bigText(t) { const d = document.createElement('div'); d.className = 'ig-big'; d.textContent = t; d.style.whiteSpace = 'nowrap'; d.style.fontSize = 'clamp(36px,10vw,100px)'; document.body.appendChild(d); d.animate([{ transform: 'translate(-50%,-50%) scale(.5)', opacity: 0 }, { transform: 'translate(-50%,-50%) scale(1.1)', opacity: 1, offset: .25 }, { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: .7 }, { transform: 'translate(-50%,-60%) scale(1)', opacity: 0 }], { duration: 950, easing: 'ease-out' }); setTimeout(() => d.remove(), 950); }

/* ---------- flow ---------- */
function pause() { if (!G || G.paused || G.state !== 'play' && G.state !== 'intro') return; G.paused = true; music && music.stop(); const d = E.pauseMenu({ onResume: () => { G.paused = false; music = E.music(G.music30 ? E.SONGS.race : E.SONGS.tense); }, onRestart: () => startMatch(), extra: '<button class="ig-btn ghost" data-a="menu">Change character / bots</button>' }); d.querySelector('[data-a=menu]').onclick = () => { d.remove(); title(); }; }
addEventListener('keydown', e => { if ((e.code === 'Escape' || e.code === 'KeyP') && G && !G.paused) pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
function title() {
  G = null; if (music) music.stop(); music = null; blobs.length = 0; blobIM.count = 0; bombs.forEach(b => scene.remove(b.m)); bombs.length = 0; document.querySelectorAll('.tl-judge').forEach(d => d.remove());
  if (shellEl) { shellEl.pad.hidden = true; document.querySelector('.ig-top').hidden = true; } ['tlBar', 'tlMap', 'tlInk', 'tlResp'].forEach(id => $(id).hidden = true);
  // showcase: a painted arena with idle crews
  resetPaint(); for (let i = 0; i < 70; i++) { const t = i % 2, x = rnd(-A + 2, A - 2), z = t ? rnd(-A + 2, 4) : rnd(-4, A - 2); if (!solidAt(x, z, .5)) paint(x, z, rnd(.8, 2.2), t, null); }
  setupUnits(); units.forEach(u => { u.x += rnd(-3, 3); u.z += u.team ? rnd(2, 6) : -rnd(2, 6); cpose(u.rig, u.model, PZ.idle(u.x)); dressUnit(u, 0); });
  const extra = `<div class="tl-opts"><div><p class="ig-sub tl-lbl">Your painter</p><div class="pick" id="pC">${CHARS.map((c, i) => `<button data-i="${i}" class="${i === S.char ? 'on' : ''}">${c.name}</button>`).join('')}</div></div>
  <div><p class="ig-sub tl-lbl">Bots</p><div class="pick" id="pS">${Object.entries(SKILL).map(([k, v]) => `<button data-s="${k}" class="${k === S.skill ? 'on' : ''}">${v.label}<small>${k === 'chill' ? 'Relaxed, wobbly aim' : k === 'normal' ? 'A fair fight' : 'Sharp aim, fast'}</small></button>`).join('')}</div></div>
  <p class="ig-sub" style="font-size:13px">4 vs 4 · 2:30 match · Team <b style="color:var(--teal)">Teal</b> vs <b style="color:var(--coralT)">Coral</b>${S.best ? ` · best ${S.best}%` : ''}</p></div>`;
  const d = E.titleScreen({ title: 'Tide Lines', kicker: 'Inoa Games · 4v4 Team Turf', lead: 'Grab a water cannon and cover the pier in teal. The team with the most painted floor when the clock hits zero wins!', how: [['🕹️', 'Move: WASD, arrows, left stick'], ['💦', 'Spray: hold Space / mouse / 💦 — drag 💦 or right stick to aim'], ['🪣', 'Refill: stand on your own colour'], ['💣', 'Ink bomb: E / 💣 (big splash)'], ['💥', 'Splat rivals — they pop back at base']], extra, onPlay: () => { save(); startMatch(); } });
  d.querySelectorAll('#pC button').forEach(b => b.onclick = () => { S.char = +b.dataset.i; d.querySelectorAll('#pC button').forEach(x => x.classList.toggle('on', x === b)); SFX.click(); });
  d.querySelectorAll('#pS button').forEach(b => b.onclick = () => { S.skill = b.dataset.s; d.querySelectorAll('#pS button').forEach(x => x.classList.toggle('on', x === b)); SFX.click(); });
}
title(); ld.done(); window.__READY = true;
E.loop((dt) => { if (window.__HOLD) return; update(dt); updateCamera(dt); R.render(dt); });
window.__GAME = { get G() { return G; }, S, startMatch, update, updateCamera, title, units, counts, pct, paintable: () => paintable, set auto(v) { window.__AUTOPILOT = v; if (G) G.auto = v; } };
</script>
