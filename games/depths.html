  titleEl = E.titleScreen({ party: { label: E.L('Phones as controllers (up to 4 players)', 'Teléfonos como controles (hasta 4 jugadores)'), hint: E.L('Phone 1 plays P1. Phones 2 to 4 jump in as P2 to P4 (they take over the AI allies).', 'El teléfono 1 es J1. Los teléfonos 2 a 4 entran como J2 a J4 (reemplazan a los aliados IA).') }, title: 'Pixel Pact: Depths', kicker: 'Inoa Games · Signature 3D', lead: E.L('Dive beneath the islands with your party. Two acts of 8 rooms each: choose boons, beat the captain, then face the crystal colossus.', 'Bucea bajo las islas con tu grupo. Dos actos de 8 salas: elige dones, vence al capitán y luego enfrenta al coloso de cristal.'), how: [['🕹️', E.L('Move: WASD / arrows / stick', 'Moverse: WASD / flechas / palanca')], ['⚔️', E.L('Attack: J or Space (pad A), tap in rhythm for combos', 'Atacar: J o Espacio (mando A), pulsa a ritmo para combos')], ['💨', E.L('Dodge roll: K or Shift (pad B), untouchable mid-roll', 'Rodar: K o Shift (mando B), intocable al rodar')], ['✨', E.L('Special: L or E (pad X) · 🔥 Ultimate: I or Q (pad Y)', 'Especial: L o E (mando X) · 🔥 Definitivo: I o Q (mando Y)')], ['🟥', E.L('Red zones on the floor = incoming attack. Roll out!', 'Zonas rojas en el suelo = ataque. ¡Rueda fuera!')]], extra, onPlay: () => { save(); titleEl = null; newRun(); } });
  const d = titleEl;
  d.querySelectorAll('#pX button').forEach(b => b.onclick = () => { const n = +b.dataset.x; if (n === 2 && !act2Open()) { SFX.bad(); E.toast(E.L('Beat Captain Brinehollow (Act I) to unlock Act II', 'Vence al capitán Brinehollow (Acto I) para abrir el Acto II'), 2200, true); return; } S.act = n; d.querySelectorAll('#pX button').forEach(x => x.classList.toggle('on', x === b)); E.say(loc(ACTS[n], 'name')); });

function showCamp() {

    el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const m = META.find(x => x.id === b.dataset.m); const l = ml(m.id), cost = m.cost(l); if (l >= m.max || S.gold < cost) return; S.gold -= cost; S.meta[m.id] = l + 1; save(); SFX.level(); render(); });

function titleUpdate(dt) {

  camera.position.set(Math.sin(t * .08) * 9.5, 5.2, Math.cos(t * .08) * 9.5); camera.lookAt(0, .9, 0);
  sun.position.set(4, 18, 6); sun.target.position.set(0, 0, 0); sun.target.updateMatrixWorld();

function heroVisualCamp(h, dt) { const g0 = G; G = { t: camp.t, won: false }; try { heroVisual(h, dt); } finally { G = g0; } }

title(); ld.done(); window.__READY = true;
E.loop(dt => { if (window.__HOLD) return; update(dt); R.render(dt); });

  get G() { return G; }, R, LIGHTS, S, update, render() { R.render(1 / 60); }, title, newRun, pickCard, joinP2, autopilot: false,

  lab(list) { for (const h of G.heroes) scene.remove(h.g); G.heroes = []; for (const f of G.foes) scene.remove(f.g); G.foes = []; G.room.waves = []; G.room.phase = 'lab';
    list.forEach((c, i) => { const h = makeHero(c[0], 'bot', i); G.heroes.push(h); h.state = c[1]; h.combo = c[2] || 0; h.st = c[3] || 0; h.anim = COMBOS[h.cls][h.combo].anim; h.x = c[4]; h.z = c[5]; h.h = c[6] ?? Math.PI * .8; for (let k = 0; k < 40; k++) heroVisual(h, 1 / 60); });
    for (const f of (arguments[1] || [])) { const e = makeFoe(f[0], f[2], f[3], { h: f[4] ?? 0 }); e.state = f[1]; e.st = f[5] || 0; e.atk = f[6]; e.invuln = true; for (let k = 0; k < 40; k++) foeVisual(e, 1 / 60); }
    G.paused = true; camState.look.set(0, 0, 0); window.__GAME.zoom = arguments[2] || 10; placeCamera(1, true); },
  clearFoes() { for (const f of G.foes) scene.remove(f.g); G.foes = []; G.room.waves = []; },
