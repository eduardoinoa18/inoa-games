  camera.position.copy(G.camNow.pos); if (G.done && G.seq == null && G.camTo && !E.reducedMotion()) { const t = performance.now() / 1000; camera.position.x += Math.sin(t * .4) * .25; } camera.lookAt(G.camNow.look);
}
// (turning the phone during the finale keeps the push-in going)
function onResize() { if (!G) return; const p = portrait(); if (G.done) { const had = !!G.camTo; fitCamera(); if (had) { pushIn(); if (!G.seq || G.seq.phase > 2) { G.camNow.pos.copy(G.camTo.pos); G.camNow.look.copy(G.camTo.look); } } return; } if (p !== G.port) { if (G.drag) { const it = G.drag.it; G.drag = null; goHome(it); } layout(true); } else fitCamera(); G.camNow.pos.copy(G.cam.pos); G.camNow.look.copy(G.cam.look); }
addEventListener('resize', onResize);
// some phones (and headless runs) deliver the rotation late: the frame loop also notices a changed orientation
// (the menu box behind the title card is not a game: a hidden tab or ⏸ there must not open the pause menu)
function pause() { if (!G || G.paused || G.done || G.attract) return; G.paused = true; if (G.drag) { const it = G.drag.it; G.drag = null; goHome(it); } music && music.stop(); E.pauseMenu({ onResume: () => { G.paused = false; music = E.music(E.SONGS.chill); }, onRestart: () => startLevel(G.li), extra: `<p class="ig-sub">${G.L.e} ${nm(G.L)} · ${G.placed}/${G.items.length} ${T('placed', 'colocadas')}</p>` }); }
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------------- title: themed rooms + boxes ---------------- */
function tidyAll() { if (!G) return; G.playing = false; G.attract = true; for (const it of G.items) { const s = G.cont.slots[it.idx]; it.state = 'placed'; it.slot = s; s.item = it; it.g.position.copy(slotPos(s)); it.g.rotation.y = s.yaw; it.toYaw = s.yaw; } G.placed = G.items.length; hudKey = ''; }
function preview(li) { return Promise.resolve(startLevel(li, { quiet: true })).then(() => { if (document.querySelector('.ig-title')) tidyAll(); }); }
const roomStars = r => r.levels.reduce((a, id) => a + (S.stars[id] || 0), 0);
function title() {
  document.querySelectorAll('.ig-screen,.pf-replay,.pf-stars').forEach(e => e.remove()); $('keyHint').hidden = true;
  if (!isOpen(S.sel)) S.sel = ORDER[0];
  let roomSel = Math.max(0, roomOf(S.sel));
  // a calm, tidy box on the table behind the menu
  preview(S.sel); if (G) G.attract = true;
  const extra = `<div class="pf-extra"><div><div class="pf-lbl">${T('Choose a room', 'Elige un cuarto')}</div><div class="pf-rooms" id="pRooms"></div><div class="pf-lv" id="pLv"></div><div class="pf-goal" id="pGoal"></div></div><div><div class="pf-lbl">${T('Options', 'Opciones')}</div><div class="pf-opts"><button class="ig-chipbtn ${S.zen ? 'on' : ''}" id="oZen">🍃 ${T('Zen mode', 'Modo zen')}<small>${T('No timer, just vibes', 'Sin reloj, con calma')}</small></button><button class="ig-chipbtn ${S.oneWrong ? 'on' : ''}" id="oWrong">😬 ${T('One wrong', 'Uno torcido')}<small>${T('Leaves one thing crooked for the clip', 'Deja una cosa torcida para el video')}</small></button></div></div><div><div class="pf-lbl">${T("Watch a friend's layout", 'Mira el orden de un amigo')}</div><div class="pf-code"><input id="code" placeholder="PF-…" maxlength="24" aria-label="${T('Share code', 'Código')}"><button class="ig-chipbtn" id="codeGo">▶ ${T('Replay', 'Ver')}</button></div></div></div>`;
  const d = E.titleScreen({ title: 'Perfect Fit', kicker: T(`Inoa Games · Cozy 3D · ${LEVELS.length} boxes`, `Inoa Games · 3D relajante · ${LEVELS.length} cajas`), lead: T('Everything has its place. Drag each thing into the spot shaped just like it — no rush, no fails, just that click.', 'Todo tiene su lugar. Arrastra cada cosa al hueco con su misma forma: sin prisa, sin perder, solo ese clic.'), how: [['👆', T('Drag an item with your finger or mouse', 'Arrastra una cosa con el dedo o el ratón')], ['🧩', T('Drop it on its matching outline — later boxes match colours too', 'Suéltala sobre su silueta; en las últimas cajas también cuenta el color')], ['⌨️', T('Tab / arrows to choose, Space to pick up and place · Pad or phone: D-pad + A', 'Tab / flechas para elegir, Espacio para tomar y colocar · Mando o teléfono: cruceta + A')]], extra, onPlay: () => { G && (G.attract = false); startLevel(S.sel); } });
  const goal = () => { const L = LEVELS[S.sel], n = buildContainerCount(S.sel), b = S.best[L.id]; d.querySelector('#pGoal').innerHTML = `${L.e} <b>${nm(L)}</b> · ${n} ${T('things', 'cosas')}${b != null ? ` · ${T('best', 'récord')} ${fmt(b)}` : ''}<br><small>${goalText(L)}</small>`; };
  const render = () => {
    d.querySelector('#pRooms').innerHTML = ROOMS.map((r, i) => { const open = isOpen(LIDX[r.levels[0]]); return `<button class="pf-room ${i === roomSel ? 'on' : ''}" data-r="${i}" ${open ? '' : 'disabled'}><span>${open ? r.e : '🔒'}</span><b>${T(r.name, r.es)}</b><small>★ ${roomStars(r)}/${r.levels.length * 3}</small></button>`; }).join('');
    d.querySelector('#pLv').innerHTML = ROOMS[roomSel].levels.map(id => { const i = LIDX[id], L = LEVELS[i], o = isOpen(i), st = S.stars[id] || 0; return `<button data-i="${i}" class="${i === S.sel ? 'on' : ''}" ${o ? '' : 'disabled'} aria-label="${nm(L)}${o ? '' : ' 🔒'}"><span class="e">${o ? L.e : '🔒'}</span>${nm(L)}<span class="st">${'★'.repeat(st)}${'☆'.repeat(3 - st)}</span></button>`; }).join('');
    d.querySelectorAll('#pRooms button').forEach(b => b.onclick = () => { roomSel = +b.dataset.r; const R0 = ROOMS[roomSel]; const firstOpen = R0.levels.map(id => LIDX[id]).filter(isOpen); const pickI = firstOpen.find(i => !S.stars[LEVELS[i].id]) ?? firstOpen[0]; if (pickI != null && roomOf(S.sel) !== roomSel) { S.sel = pickI; save(); preview(S.sel); } E.tone(880, .04, 'sine', .04); render(); });
    d.querySelectorAll('#pLv button').forEach(b => b.onclick = () => { S.sel = +b.dataset.i; save(); preview(S.sel); E.tone(1000, .04, 'sine', .04); render(); });
    goal();
  };
  render();
  d.querySelector('#oZen').onclick = e => { S.zen = !S.zen; save(); e.currentTarget.classList.toggle('on', S.zen); };
  d.querySelector('#oWrong').onclick = e => { S.oneWrong = !S.oneWrong; save(); e.currentTarget.classList.toggle('on', S.oneWrong); };
  setTimeout(() => d.querySelector('[data-a=play]')?.focus(), 50);
  d.querySelector('#codeGo').onclick = () => { const c = parseCode(d.querySelector('#code').value); if (!c) { E.toast(T('That code doesn’t look right. It starts with PF-', 'Ese código no parece correcto. Empieza con PF-'), 2200); return; } d.remove(); startLevel(c.li, { replay: c }); };
  return d;
}

// menus (title, pause, results) are driven by the engine's built-in focus ring for gamepads and phones
// language switch from the shared settings panel: rebuild the menu text / HUD in place
addEventListener('inoa:settings', e => { if (!e.detail || e.detail.key !== 'lang') return; hudKey = ''; hud(); if (document.querySelector('.ig-title')) title(); });
registerProc();
title(); ld.done(); window.__READY = true;
E.loop((dt) => { update(dt); updateCamera(dt); R.render(dt); });
window.__GAME = {
  get G() { return G; }, S, LEVELS, ROOMS, ORDER, update, startLevel, title, autoSolve, shareCode: () => shareCode(), parseCode, isOpen, MATERIAL, label, parOf: li => parOf(LEVELS[li]), pause, turns: () => LEVELS.map(L => chooseLayout(L, portrait()).turn),
  pickAt: (x, y, touch) => { const it = pickAt(x, y, touch); return it ? it.idx : -1; }, rayHit: (x, y) => { for (const it of G.items) it.g.updateMatrixWorld(true); setRay(x, y); return ray.intersectObjects(G.items.filter(pickable).map(i => i.proxy), false).length > 0; },
  // smallest slot on screen (px) — thumb-friendliness check per box
  minSlotPx: () => Math.min(...G.cont.slots.map((s, i) => { const r = window.__GAME.slotRectPx(i); return Math.min(r.w, r.h); })),
  itemScreen: i => { const it = G.items[i]; const p = it.g.position.clone(); p.y += it.size.y * .5; return E.toScreen(p, camera); },
  slotScreen: i => E.toScreen(slotPos(G.cont.slots[i]), camera),
  slotFor: i => G.cont.slots.findIndex(s => !s.item && s.name === G.items[i].name),
  wrongSlotFor: i => G.cont.slots.findIndex(s => !s.item && s.name !== G.items[i].name),
  dragInfo: () => G.drag ? { fp: G.drag.fp ? E.toScreen(G.drag.fp, camera) : null, item: E.toScreen(G.drag.it.g.position, camera), near: G.drag.near ? G.drag.near.s.i : -1, touch: !!G.drag.touch, idx: G.drag.it.idx } : null,
  slotRectPx: i => { const s = G.cont.slots[i], p = slotPos(s), V = (x, z) => E.toScreen(p.clone().add(new THREE.Vector3(x, 0, z)), camera); const a = V(-s.w / 2, 0), b = V(s.w / 2, 0), c = V(0, -s.d / 2), e = V(0, s.d / 2); return { w: Math.hypot(b.x - a.x, b.y - a.y), h: Math.hypot(e.x - c.x, e.y - c.y) }; },
  itemPx: i => { const it = G.items[i]; const a = E.toScreen(it.g.position.clone().add(new THREE.Vector3(-it.size.x / 2, 0, 0)), camera), b = E.toScreen(it.g.position.clone().add(new THREE.Vector3(it.size.x / 2, 0, 0)), camera); return Math.abs(b.x - a.x); }
};
</script>
