  placeDecor(id, x, z, r = 0) { if (G.mode !== 'decor') openDecor(); selectDecor(id); G.decor.r = r; snapGhost(x, z); const ok = G.decor.ok; placeGhost(); return ok; },
  away: awaySummary, awayMinutes, R, frame() { updateCamera(0, true); updateLabels(); },
  barista, get camera() { return camera; },
  get resultsCount() { return resultsCount; }, setLang, get lang() { return LANG; },
  ingScreen(id) { camera.updateMatrixWorld(); const p = E.toScreen(ingObjs[id].position.clone().add(V3(0, .06, 0)), camera); return [p.x, p.y]; },
  teapotScreen() { camera.updateMatrixWorld(); const p = E.toScreen(TEAPOT_POS.clone(), camera); return [p.x, p.y]; },
  labelRects() { return [...labelsEl.children].filter(d => d.style.display !== 'none' && d.offsetWidth).map(d => { const r = d.getBoundingClientRect(); return [Math.round(r.left), Math.round(r.top), Math.round(r.right), Math.round(r.bottom), d.textContent]; }); },
  sim(sec) { for (let i = 0; i < sec * 60; i++) update(1 / 60); }
};
</script>
